name: Cat-A2c Open Images human labels (real public CPU holdout)
on:
  pull_request:
    branches: [main]
    paths:
      - "microduck_companion/cata2c_openimages_human_labels.py"
      - "tests/test_cata2c_openimages_human_labels.py"
      - ".github/workflows/cat-a2c-openimages-human.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned host-only Cat-A dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==1.26.4 onnxruntime==1.21.0
      - name: Check source/rights gate and binary-scoring adversarial fixtures
        run: python -m unittest discover -s tests -p 'test_cata2c_openimages_human_labels.py' -v
      - name: Fetch official Open Images metadata, human verification and pinned YOLOX
        shell: bash
        run: |
          set -euo pipefail
          # Official Google Open Images V7 metadata and human-verified
          # image-level labels (CC BY 4.0). No photographs in GitHub.
          curl --fail --location --retry 2 --max-time 150 \
            --output "$RUNNER_TEMP/oidv7-class-descriptions-boxable.csv" \
            "https://storage.googleapis.com/openimages/v7/oidv7-class-descriptions-boxable.csv"
          curl --fail --location --retry 2 --max-time 150 \
            --output "$RUNNER_TEMP/validation-images-with-rotation.csv" \
            "https://storage.googleapis.com/openimages/2018_04/validation/validation-images-with-rotation.csv"
          curl --fail --location --retry 2 --max-time 150 \
            --output "$RUNNER_TEMP/oidv7-val-annotations-human-imagelabels.csv" \
            "https://storage.googleapis.com/openimages/v7/oidv7-val-annotations-human-imagelabels.csv"
          # The same frozen Apache-2.0 model and threshold as Cat-A2a.
          curl --fail --location --retry 2 --max-time 150 \
            --output "$RUNNER_TEMP/yolox_nano.onnx" \
            "https://huggingface.co/skillsafe-ai/yolox-nano/resolve/8e308810ede488f742901a4ac597dc7796798e46/yolox_nano.onnx"
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  $RUNNER_TEMP/yolox_nano.onnx" | sha256sum --check
      - name: Measure new public images at unchanged YOLOX threshold (no motor)
        shell: bash
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          # Bounded set: 4 exact COCO/OpenImages categories; 6 human
          # positives and 6 human negatives each = 48 distinct photos.
          # Presence only, not box-AP, low 25cm camera or independent scene.
          python -m microduck_companion.cata2c_openimages_human_labels \
            --approved-public-media \
            --model-path "$RUNNER_TEMP/yolox_nano.onnx" \
            --classes-path "$RUNNER_TEMP/oidv7-class-descriptions-boxable.csv" \
            --metadata-path "$RUNNER_TEMP/validation-images-with-rotation.csv" \
            --labels-path "$RUNNER_TEMP/oidv7-val-annotations-human-imagelabels.csv" \
            > "$RUNNER_TEMP/cata2c_public_binary_report.json"
          python - "$RUNNER_TEMP/cata2c_public_binary_report.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              r = json.load(f)
          assert r["total_public_images"] == 48
          assert set(r["category_results"]) == {"person","cat","dog","chair"}
          assert all(v["positive_images"] == v["negative_images"] == 6 for v in r["category_results"].values())
          assert r["known_low_camera_height_images"] == 0
          assert r["sports_ball_class_tested"] is False
          assert r["unknown_object_rejection_tested"] is False
          assert r["memory_generalization_c3_validated"] is False
          assert r["motor_commands"] == 0 and r["sqlite_writes"] == 0
          print(json.dumps(r, sort_keys=True))
          PY
