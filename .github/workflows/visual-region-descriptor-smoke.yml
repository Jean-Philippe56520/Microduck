name: Kwipi object colour and approximate shape (host experiment)
on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/visual_region_descriptor*.py"
      - "tests/test_visual_region_descriptors.py"
      - ".github/workflows/visual-region-descriptor-smoke.yml"
      - "tests/assets/public_vision_smoke/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  region-descriptor:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing Pillow version only
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Synthetic shape, colour, background and invalid-ROI positive/negative tests
        run: python -m unittest discover -s tests -p 'test_visual_region_descriptors.py' -v
      - name: Describe 13 public images using existing pinned YOLOX candidate regions
        env:
          VISUAL_REGION_SMOKE_REPORT: ${{ runner.temp }}/visual-region-smoke.json
        run: python -m experiments.visual_region_descriptor_smoke
      - name: Preserve JSON text only (no images or model)
        uses: actions/upload-artifact@v4
        with:
          name: kwipi-visual-region-colour-shape-host-json
          path: ${{ runner.temp }}/visual-region-smoke.json
          if-no-files-found: error
