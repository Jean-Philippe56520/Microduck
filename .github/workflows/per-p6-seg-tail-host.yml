name: PER-P6 YOLO26-seg tail ONNX and RKNN host mask decode

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/per-p6-seg-tail-host.yml"
      - "experiments/per_p5_yolo26_rknn_compat.py"
      - "experiments/per_p6_yolo26seg_tail.py"
      - "tests/test_per_p6_yolo26seg_tail.py"
      - "docs/per-p6-yolo26seg-tail-host-prereg-2026-10-30.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tail-compatibility:
    name: yolo26n-seg host decoder
    runs-on: ubuntu-22.04
    timeout-minutes: 58
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      ULTRALYTICS_AUTOINSTALL: "false"
      YOLO_CONFIG_DIR: /tmp/per-p6-ultralytics-config
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify immutable OEM gitlinks and absence of private media
        run: |
          set -euo pipefail
          git ls-tree HEAD upstream/microduck | grep -F '942e58e3aa6dbb28e7037203fff11866122c7567'
          git ls-tree HEAD upstream/microduck_rl | grep -F 'b02fdea4902c2b93b7d34a83a6f05da4ececb7d3'
          test ! -e kwipi_photos_privees_tests_2026-10-30.zip
      - uses: actions/checkout@v4
        with:
          repository: airockchip/rknn_model_zoo
          ref: 837db8e992815ff8647eadb709f07067f4bc3a71
          path: vendor-zoo
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /datasets/COCO/coco_subset_20.txt
            /datasets/COCO/subset/
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: airockchip/rknn-toolkit2
          ref: 42aa1d426c0a9e0869b6374edba009f7208a1926
          path: vendor-rknn
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /rknn-toolkit2/packages/x86_64/rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
            /rknn-toolkit2/packages/x86_64/requirements_cp310-2.3.2.txt
          persist-credentials: false
      - name: Verify pinned supplier checkout and official calibration set
        run: |
          set -euo pipefail
          test "$(git -C vendor-zoo rev-parse HEAD)" = '837db8e992815ff8647eadb709f07067f4bc3a71'
          test "$(git -C vendor-rknn rev-parse HEAD)" = '42aa1d426c0a9e0869b6374edba009f7208a1926'
          test -f vendor-zoo/datasets/COCO/coco_subset_20.txt
          test "$(find vendor-zoo/datasets/COCO/subset -name '*.jpg' -type f | wc -l)" -eq 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned x86 host export stack (no NPU runtime)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'pip==24.3.1' 'setuptools==80.9.0' 'numpy==1.26.4' \
            'onnx==1.16.2' 'onnxruntime==1.18.1' 'protobuf==4.25.4' \
            'psutil==6.0.0' 'ruamel.yaml==0.18.6' 'scipy==1.11.4' \
            'fast-histogram==0.14' 'opencv-python-headless==4.9.0.80' \
            'tqdm==4.66.4'
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'torch==2.4.0+cpu' 'torchvision==0.19.0+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'ultralytics==8.4.192' 'Pillow==11.3.0' \
            'numpy==1.26.4' 'opencv-python==4.9.0.80'
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps \
            vendor-rknn/rknn-toolkit2/packages/x86_64/rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          python -m pip check
          python -c 'import torch, onnx, numpy, scipy, rknn, ultralytics; from rknn.api import RKNN; print("verified imports:", torch.__version__, onnx.__version__, numpy.__version__, scipy.__version__, ultralytics.__version__)'
      - name: Positive and negative tests of static source gate (before model loading)
        run: |
          set -euo pipefail
          python -m compileall -q experiments/per_p5_yolo26_rknn_compat.py experiments/per_p6_yolo26seg_tail.py tests/test_per_p6_yolo26seg_tail.py
          python -m unittest discover -s tests -p 'test_per_p6_yolo26seg_tail.py' -v
      - name: Download one authorized official weight and verify SHA256
        env:
          WEIGHT: yolo26n-seg.pt
          EXPECTED: 361fbfabab285c3237700b6bb91d7ecfa602cd945fffda8dbe1242829b71e73f
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p6-models"
          curl --fail --location --retry 2 --max-time 180 \
            --output "$RUNNER_TEMP/p6-models/$WEIGHT" \
            "https://github.com/ultralytics/assets/releases/download/v8.4.0/$WEIGHT"
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/p6-models/$WEIGHT" | sha256sum --check
      - name: One official INT8 conversion and composed ONNX tail on SDK simulator
        env:
          WEIGHT: yolo26n-seg.pt
        run: |
          set -euo pipefail
          timeout 2400s python -m experiments.per_p6_yolo26seg_tail \
            --weight "$RUNNER_TEMP/p6-models/$WEIGHT" \
            --calibration "$GITHUB_WORKSPACE/vendor-zoo/datasets/COCO/coco_subset_20.txt" \
            --report "$RUNNER_TEMP/per-p6-seg-tail-numbers.json"
      - name: Preserve JSON numerical status only, never model or images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-p6-seg-tail-numeric-only
          path: ${{ runner.temp }}/per-p6-seg-tail-numbers.json
          if-no-files-found: warn
          retention-days: 14
