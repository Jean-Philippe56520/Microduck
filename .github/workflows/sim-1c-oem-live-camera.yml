# SIM-1C: ONE attempted *live* OEM MuJoCo camera -> mediad -> YOLOX -> MOCK F2.
# Preregistered BEFORE this workflow was added:
# docs/sim-1c-oem-live-camera-preregister-2026-11-05.md
# STOP if exact OEM pins, third-party plugin digest, frame, telemetry or ONNX fail.
# No persistent images, motor commands from Companion, model tuning, robot/NPU.
name: SIM-1C/1D OEM live camera 2Hz paired-world diagnostic

on:
  push:
    branches:
      - test/sim-1c-oem-live-camera-20261105
      - test/sim1d-oem-2hz-ball-absent-20261106
      - test/sim1db-home-control-20261106
      - test/sim1db2-exact-gt-20261107
    paths:
      - ".github/workflows/sim-1c-oem-live-camera.yml"
      - "docs/sim-1c-oem-live-camera-preregister-2026-11-05.md"
      - "microduck_companion/sim_vis_oem_cycle.py"
      - "experiments/sim1d_oem_2hz_series.py"
      - "tests/test_sim1d_oem_2hz_series.py"
      - "docs/sim-1d-2hz-oem-paired-preregister-2026-11-06.md"
      - "docs/sim-1db2-exact-gt-preregister-2026-11-07.md"
      - "experiments/sim1db2*.py"
      - "experiments/sim1db2_hook/sitecustomize.py"
      - "tests/test_sim1db2_frame_match.py"
  workflow_dispatch:
    inputs:
      run_sim1d:
        description: "Enable the preregistered 10+10-cycle OEM camera trial"
        required: false
        type: boolean
        default: false
      run_sim1db:
        description: "SIM-1D/B1: HOME/HOME control, not recognition or synced GT"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sim-1c-oem-camera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SIM1DB: ${{ github.ref_name == 'test/sim1db-home-control-20261106' || inputs.run_sim1db }}
      SIM1DB2: ${{ github.ref_name == 'test/sim1db2-exact-gt-20261107' }}
      MUJOCO_GL: osmesa
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      DUCK_SIM_STATE: /tmp/kwipi-sim-1c-camera
      DUCK_SIM_PORT: "17841"
      DUCK_SIM_FRAME_PORT: "17941"
      DUCK_SIM_DUCKS: "1"
      DUCK_SIM_VIEWER: "0"
      DUCK_SIM_CAMERAS: a
      DUCK_SIM_SCENE: ball
      DUCK_SIM_KEYFRAME: HOME
      GST_DEBUG_NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Exact OEM gitlinks and strictly scoped source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/microduck rev-parse HEAD)" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = "b02fdea4902c2b93b7d34a83a6f05da4ececb7d3"
          test -f upstream/microduck/scripts/duck-sim
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene_ball.xml
          test -f docs/sim-1c-oem-live-camera-preregister-2026-11-05.md
          grep -q 'include file="ball.xml"' upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene_ball.xml
          ! grep -q 'include file="ball.xml"' upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene.xml
          if [ "$SIM1DB" = true ]; then
            test -f docs/sim-1db-home-control-preregister-2026-11-06.md
          fi
          if [ "$SIM1DB2" = true ]; then
            test -f docs/sim-1db2-exact-gt-preregister-2026-11-07.md
            test -f experiments/sim1db2_hook/sitecustomize.py
            test "$(git hash-object upstream/microduck_rl/src/mjlab_microduck/sim/camera.py)" = "5769a9eb9967737a82ba146d2e0c9db0ceef6eb2"
            echo "B2_PINNED_CAMERA_SOURCE: PASS_NOT_PATCHED"
          fi
          echo "S0_SOURCE_PINS: PASS"

      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "upstream/microduck_rl/uv.lock"

      - name: System build, official GStreamer and offscreen MuJoCo dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libudev-dev pkg-config libasound2-dev \
            libosmesa6 libgl1-mesa-dri \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-nice \
            libnice10
          uv python install 3.12
          uv venv --python 3.12 upstream/microduck_rl/.venv
          uv pip install --python upstream/microduck_rl/.venv/bin/python \
            'mujoco==3.10.0' 'numpy==2.5.4' 'onnxruntime==1.28.0' \
            'Pillow==11.3.0' 'PyOpenGL==3.1.10'
          export PYTHONPATH="$GITHUB_WORKSPACE/upstream/microduck_rl/src:$GITHUB_WORKSPACE"
          upstream/microduck_rl/.venv/bin/python -c 'import mjlab_microduck.sim.body_server, onnxruntime, PIL'
          echo "S0_OFFSCREEN_RL_RUNTIME: PASS"
          upstream/microduck_rl/.venv/bin/python -m unittest discover -s tests -p 'test_sim1d*.py' -v

      - name: SIM-1D/B1 common scene source and bounded wrong-label test preparation
        if: env.SIM1DB == 'true'
        shell: bash
        run: |
          set -euo pipefail
          upstream/microduck_rl/.venv/bin/python - <<'PYGATE'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("upstream/microduck_rl/src/mjlab_microduck/robot/microduck")
          a, b = (ET.parse(root / name).getroot() for name in ("scene_ball.xml", "scene.xml"))
          # HOME ignores the named keyframes. Compare all remaining scene fields.
          for node in (a, b):
              node.attrib.pop("model")
              for child in list(node):
                  if child.tag == "keyframe" or (child.tag == "include" and child.get("file") == "ball.xml"):
                      node.remove(child)
          def canonical(node):
              return (node.tag, tuple(sorted(node.attrib.items())),
                      " ".join((node.text or "").split()), tuple(canonical(c) for c in node))
          assert canonical(a) == canonical(b), "STOP_COMMON_SCENE_DIFFERS"
          print("SIM1DB_COMMON_ROBOT_DECOR_LIGHT: PASS_SOURCE_ONLY")
          PYGATE
          cat > "$RUNNER_TEMP/sim1db-label-negative.py" <<'PYNEG'
          import json
          import os
          from pathlib import Path
          import sys
          from experiments.sim1d_launch_context import verify_launch_context
          from experiments.sim1d_oem_2hz_series import run_series
          actual = sys.argv[1]
          assert actual in ("ball", "empty")
          state = Path(os.environ["DUCK_SIM_STATE"])
          context = verify_launch_context(state, actual)
          assert context["initial_keyframe"] == "HOME"
          def forbidden(*args, **kwargs):
              raise AssertionError("negative label reached acquisition or inference")
          wrong = "empty" if actual == "ball" else "ball"
          report = run_series(state, object(), world_case=wrong,
                              observe=forbidden, acquire=forbidden, evaluate=forbidden)
          assert report["status"] == "STOP_ACTIVE_WORLD_UNVERIFIED"
          assert report["completed_cycles"] == 0 and report["world_contains_ball_xml"] is None
          assert report["motor_commands_issued"] == 0 and report["experience_writes"] == 0
          assert report["image_written"] is False and report["samples"] == []
          report["actual_case_checked"] = actual
          report["actual_initial_keyframe"] = context["initial_keyframe"]
          path = Path(os.environ["RUNNER_TEMP"]) / ("sim-1db-" + actual + "-negative.json")
          path.write_text(json.dumps(report, indent=2, allow_nan=False) + "\n")
          print("SIM1DB_WRONG_LABEL_" + actual.upper() + ": PASS_ZERO_ACQUISITION")
          PYNEG

      - name: Verify official Pollen Reachy x86 plugin SHA; diagnostic only, not OEM promotion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sim-1c-plugins"
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            'https://github.com/pollen-robotics/reachy-mini-desktop-app/raw/c6ea61a5d57dc069e01aab07c723402b3d8263f5/src-tauri/linux/gstreamer-plugins/x86_64/libgstrswebrtc.so' \
            -o "$RUNNER_TEMP/sim-1c-plugins/libgstrswebrtc.so"
          echo "3045989c437be6f7859262f1970c550d6fc92d9ea9b59e49a05d5ec7bc4afbe9  $RUNNER_TEMP/sim-1c-plugins/libgstrswebrtc.so" | sha256sum -c -
          echo "GST_PLUGIN_PATH=$RUNNER_TEMP/sim-1c-plugins" >> "$GITHUB_ENV"
          GST_PLUGIN_PATH="$RUNNER_TEMP/sim-1c-plugins" gst-inspect-1.0 webrtcsink >/dev/null
          echo "S0_THIRD_PARTY_DIAGNOSTIC_PLUGIN: loaded_not_OEM_0_15_3"

      - name: Fetch only approved SHA-pinned Nano ONNX for CPU host
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            'https://huggingface.co/skillsafe-ai/yolox-nano/resolve/8e308810ede488f742901a4ac597dc7796798e46/yolox_nano.onnx' \
            -o "$RUNNER_TEMP/sim-1c-yolox.onnx"
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  $RUNNER_TEMP/sim-1c-yolox.onnx" | sha256sum -c -
          echo "S0_HOST_MODEL_SHA: PASS"

      - name: Guard the OEM's unauthenticated WebRTC and console listeners
        shell: bash
        run: |
          set -euo pipefail
          command -v iptables
          # OEM duck-sim defaults mediad listeners to 0.0.0.0. Keep loopback
          # on this ephemeral single-duck CI host, drop other inbound traffic.
          sudo iptables -I INPUT ! -i lo -p tcp --dport 8080 -j DROP
          sudo iptables -I INPUT ! -i lo -p tcp --dport 8443 -j DROP
          echo "S0_WEBRTC_INBOUND_FILTER: PASS"

      - name: Start actual pinned OEM daemon trio and demand one live frame
        shell: bash
        run: |
          set -euo pipefail
          export DUCK_SIM_RL="$GITHUB_WORKSPACE/upstream/microduck_rl"
          export PYTHONPATH="$GITHUB_WORKSPACE:$DUCK_SIM_RL/src"
          if [ "$SIM1DB2" = true ]; then
            export KWIPI_B2_INSTRUMENT=1 KWIPI_B2_CASE=ball
            export KWIPI_B2_ARM="$RUNNER_TEMP/sim1db2-ball.arm"
            export KWIPI_B2_SIDECAR="$RUNNER_TEMP/sim1db2-ball-sidecar.ndjson"
            export PYTHONPATH="$GITHUB_WORKSPACE/experiments/sim1db2_hook:$PYTHONPATH"
          fi
          if ! timeout --signal=TERM --kill-after=15s 18m \
              upstream/microduck/scripts/duck-sim up; then
            echo "STOP_SIM1C_BODY_SERVER_STARTUP"
            # Diagnostic only: the OEM body server writes its traceback to
            # this local log. Never upload raw images, environment or tokens.
            if test -f "$DUCK_SIM_STATE/body.log"; then
              echo "BEGIN_OEM_BODY_LOG_TAIL"
              tail -n 85 "$DUCK_SIM_STATE/body.log"
              echo "END_OEM_BODY_LOG_TAIL"
            else
              echo "STOP_SIM1C_BODY_LOG_ABSENT"
            fi
            exit 1
          fi
          if [ "$SIM1DB2" = true ]; then unset KWIPI_B2_INSTRUMENT; fi
          upstream/microduck/scripts/duck-sim status
          upstream/microduck/scripts/duck-sim ctl health
          # A socket path is NOT authentication; read its metadata once.
          for i in 1 2 3 4 5; do
            if test -S "$DUCK_SIM_STATE/duck-a-frame.sock"; then break; fi
            sleep 2
          done
          test -S "$DUCK_SIM_STATE/duck-a-frame.sock"
          upstream/microduck_rl/.venv/bin/python -m microduck_companion.sim_media_frame \
            --state-dir "$DUCK_SIM_STATE" > "$RUNNER_TEMP/sim-1c-frame-metadata.json"
          echo "S1_ACTUAL_MEDIAD_FRAME: PASS"

      - name: One real OEM MuJoCo/mediad frame, real Nano inference, mock F2 decision
        if: env.SIM1DB != 'true' && env.SIM1DB2 != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export DUCK_SIM_RL="$GITHUB_WORKSPACE/upstream/microduck_rl"
          export PYTHONPATH="$GITHUB_WORKSPACE:$DUCK_SIM_RL/src"
          upstream/microduck_rl/.venv/bin/python -m microduck_companion.sim_vis_oem_cycle \
            --state-dir "$DUCK_SIM_STATE" --model "$RUNNER_TEMP/sim-1c-yolox.onnx" \
            > "$RUNNER_TEMP/sim-1c-f2-report.json"
          upstream/microduck_rl/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "sim-1c-f2-report.json").read_text())
          assert report["status"] == "HOST_UNVERIFIED_CAMERA_FRAME_TO_MOCK_F2"
          assert report["telemetry_quality"] == "coherent"
          assert report["motor_commands_issued"] == 0
          assert report["f2_mock_projection"]["motor_commands_issued"] == 0
          assert report["f2_mock_projection"]["experience_writes"] == 0
          assert not report["sensor_source_authenticated"]
          assert not report["semantic_category_verified"]
          assert not report["same_mujoco_step_verified"]
          assert not report["media_written_to_disk"]
          assert report["f2_mock_projection"]["intention"] in ("idle", "inspect")
          assert len(report["regions_untrusted"]) <= 3
          print("S2_ACTUAL_DAEMONS_TO_MOCK_F2: PASS")
          print(json.dumps({
              "status": report["status"], "telemetry_quality": report["telemetry_quality"],
              "regions": len(report["regions_untrusted"]),
              "intention": report["f2_mock_projection"]["intention"],
              "captured_at_unix_us": report["captured_at_unix_us"],
              "capture_age_s_at_decision": report["capture_age_s_at_decision"],
              "inference_ms_cpu_host": report["inference_ms_cpu_host"],
              "semantic_category_verified": False,
              "same_step_verified": False,
              "motor_commands": 0,
          }, sort_keys=True))
          PY

      - name: SIM-1D ten genuine camera-F2 cycles in OEM ball scene at fixed 2Hz
        if: github.ref_name == 'test/sim1d-oem-2hz-ball-absent-20261106' || inputs.run_sim1d || env.SIM1DB == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export DUCK_SIM_RL="$GITHUB_WORKSPACE/upstream/microduck_rl"
          export PYTHONPATH="$GITHUB_WORKSPACE:$DUCK_SIM_RL/src"
          if [ "$SIM1DB" = true ]; then
            upstream/microduck_rl/.venv/bin/python "$RUNNER_TEMP/sim1db-label-negative.py" ball
          fi
          upstream/microduck_rl/.venv/bin/python -m experiments.sim1d_oem_2hz_series --state-dir "$DUCK_SIM_STATE" --model "$RUNNER_TEMP/sim-1c-yolox.onnx" --world-case ball --output "$RUNNER_TEMP/sim-1d-ball-2hz.json"
          echo "SIM1D_BALL_10_CYCLES: PASS"

      - name: SIM-1D restart official OEM empty scene and measure ten cycles
        if: github.ref_name == 'test/sim1d-oem-2hz-ball-absent-20261106' || inputs.run_sim1d || env.SIM1DB == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export DUCK_SIM_RL="$GITHUB_WORKSPACE/upstream/microduck_rl"
          export PYTHONPATH="$GITHUB_WORKSPACE:$DUCK_SIM_RL/src"
          upstream/microduck/scripts/duck-sim down
          export DUCK_SIM_SCENE=""
          export DUCK_SIM_KEYFRAME="SIT"
          if [ "$SIM1DB" = true ]; then export DUCK_SIM_KEYFRAME="HOME"; fi
          timeout --signal=TERM --kill-after=15s 18m upstream/microduck/scripts/duck-sim up
          upstream/microduck/scripts/duck-sim status
          if [ "$SIM1DB" = true ]; then
            upstream/microduck_rl/.venv/bin/python "$RUNNER_TEMP/sim1db-label-negative.py" empty
          fi
          upstream/microduck_rl/.venv/bin/python -m experiments.sim1d_oem_2hz_series --state-dir "$DUCK_SIM_STATE" --model "$RUNNER_TEMP/sim-1c-yolox.onnx" --world-case empty --output "$RUNNER_TEMP/sim-1d-empty-2hz.json"
          echo "SIM1D_EMPTY_10_CYCLES: PASS"

      - name: SIM-1D/B1 paired HOME result, explicitly no pixel ground truth
        if: always() && env.SIM1DB == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSUM'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          rows = []
          for case in ("ball", "empty"):
              paths = (root / ("sim-1d-" + case + "-2hz.json"), root / ("sim-1db-" + case + "-negative.json"))
              report, negative = (json.loads(p.read_text()) if p.is_file() else {} for p in paths)
              context = report.get("launch_context", {})
              ok = (report.get("status") == "PASS_2HZ_OEM_READONLY_MOCK_F2"
                    and report.get("launch_context_verified") is True
                    and report.get("world_case_requested") == case
                    and report.get("world_contains_ball_xml") is (case == "ball")
                    and report.get("completed_cycles") == 10
                    and report.get("requested_cycles") == 10
                    and report.get("motor_commands_issued") == 0
                    and report.get("experience_writes") == 0
                    and report.get("semantic_category_verified") is False
                    and report.get("pixel_gt_synchronised") is False
                    and report.get("image_written") is False
                    and context.get("initial_keyframe") == "HOME"
                    and negative.get("status") == "STOP_ACTIVE_WORLD_UNVERIFIED"
                    and negative.get("completed_cycles") == 0
                    and negative.get("actual_case_checked") == case
                    and negative.get("actual_initial_keyframe") == "HOME")
              row = {"case": case, "pass_initial_home_protocol": ok,
                     "series_status": report.get("status", "NOT_EXECUTED"),
                     "initial_keyframe": context.get("initial_keyframe"),
                     "completed_cycles": report.get("completed_cycles", 0),
                     "frames_with_regions_unverified": sum(s["regions_untrusted_count"] > 0 for s in report.get("samples", [])),
                     "inspect_unknown": report.get("f2_inspect_unknown_count"),
                     "idle": report.get("f2_idle_count"),
                     "camera_interval_s": report.get("camera_interval_s"),
                     "inference_ms_cpu_host": report.get("inference_ms_cpu_host"),
                     "total_cycle_duration_s": report.get("total_cycle_duration_s"),
                     "capture_age_s": report.get("capture_age_s"),
                     "wrong_label_status": negative.get("status", "NOT_EXECUTED")}
              rows.append(row)
          passed = all(row["pass_initial_home_protocol"] for row in rows)
          result = {"status": "PASS_MATCHED_HOME_INITIALISATION_ONLY" if passed else "STOP_INCOMPLETE_HOME_PAIR",
                    "rows": rows, "pixel_gt_synchronised": False,
                    "actual_camera_pose_matched": False, "ball_recognition_verified": False,
                    "memory_effect_verified": False, "robot_validated": False}
          text = json.dumps(result, indent=2, allow_nan=False)
          (root / "sim-1db-home-pair.json").write_text(text + "\n")
          print(text)
          raise SystemExit(0 if passed else 1)
          PYSUM

      - name: SIM-1D/B2 instrumented BALL - four exact mediad frames and independent geom GT
        if: env.SIM1DB2 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          upstream/microduck_rl/.venv/bin/python -m experiments.sim1db2_live --state "$DUCK_SIM_STATE" --sidecar "$RUNNER_TEMP/sim1db2-ball-sidecar.ndjson" --arm "$RUNNER_TEMP/sim1db2-ball.arm" --model "$RUNNER_TEMP/sim-1c-yolox.onnx" --case ball --output "$RUNNER_TEMP/sim1db2-ball-result.json"
          upstream/microduck/scripts/duck-sim ctl health
          if grep -q 'behind real time' "$DUCK_SIM_STATE/body.log"; then
            echo "STOP_B2_BODY_BEHIND_REAL_TIME_BALL"
            exit 1
          fi
          echo "B2_BALL_INSTRUMENTED_EXACT_GT: PASS"

      - name: SIM-1D/B2 instrumented EMPTY - new OEM HOME launch and four zero-ball GT frames
        if: env.SIM1DB2 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export DUCK_SIM_RL="$GITHUB_WORKSPACE/upstream/microduck_rl"
          export PYTHONPATH="$GITHUB_WORKSPACE:$DUCK_SIM_RL/src"
          upstream/microduck/scripts/duck-sim down
          export DUCK_SIM_SCENE="" DUCK_SIM_KEYFRAME=HOME
          export KWIPI_B2_INSTRUMENT=1 KWIPI_B2_CASE=empty
          export KWIPI_B2_ARM="$RUNNER_TEMP/sim1db2-empty.arm"
          export KWIPI_B2_SIDECAR="$RUNNER_TEMP/sim1db2-empty-sidecar.ndjson"
          export PYTHONPATH="$GITHUB_WORKSPACE/experiments/sim1db2_hook:$PYTHONPATH"
          timeout --signal=TERM --kill-after=15s 18m upstream/microduck/scripts/duck-sim up
          unset KWIPI_B2_INSTRUMENT
          upstream/microduck/scripts/duck-sim status
          upstream/microduck/scripts/duck-sim ctl health
          upstream/microduck_rl/.venv/bin/python -m experiments.sim1db2_live --state "$DUCK_SIM_STATE" --sidecar "$RUNNER_TEMP/sim1db2-empty-sidecar.ndjson" --arm "$RUNNER_TEMP/sim1db2-empty.arm" --model "$RUNNER_TEMP/sim-1c-yolox.onnx" --case empty --output "$RUNNER_TEMP/sim1db2-empty-result.json"
          upstream/microduck/scripts/duck-sim ctl health
          if grep -q 'behind real time' "$DUCK_SIM_STATE/body.log"; then
            echo "STOP_B2_BODY_BEHIND_REAL_TIME_EMPTY"
            exit 1
          fi
          echo "B2_EMPTY_INSTRUMENTED_EXACT_GT: PASS"

      - name: SIM-1D/B2 exact-frame summary never claims uninstrumented OEM recognition
        if: always() && env.SIM1DB2 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYB2SUMMARY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          rows = []
          for case in ("ball", "empty"):
              path = root / ("sim1db2-" + case + "-result.json")
              report = json.loads(path.read_text()) if path.is_file() else {}
              ok = (report.get("status") == "PASS_B2_INSTRUMENTED_EXACT_FRAME_GT_HOST_ONLY"
                    and report.get("completed_cycles") == 4
                    and report.get("gt_exact_frame_matches") == 4
                    and report.get("case") == case
                    and report.get("visible_witness") is (case == "ball")
                    and report.get("pixel_gt_injected_into_f2") is False
                    and report.get("semantic_category_verified") is False
                    and report.get("motor_commands_companion") == 0
                    and report.get("experience_writes") == 0
                    and report.get("image_persisted") is False
                    and report.get("oem_gitlinks_changed") is False
                    and report.get("render_p95_ms", 9999) <= 40.0)
              rows.append({"case": case, "eligible_instrumented_gt": ok,
                           "cycles": report.get("completed_cycles", 0),
                           "render_p95_ms": report.get("render_p95_ms"),
                           "gt_visibility": report.get("visible_witness")})
          passed = all(x["eligible_instrumented_gt"] for x in rows)
          result = {"status": "PASS_B2_INSTRUMENTED_GT_ONLY" if passed else
                    "STOP_B2_FRAME_GT_NOT_PROVEN", "rows": rows,
                    "oem_camera_intact": False, "robot_validated": False,
                    "real_detection_accuracy_claim": False, "v1_95_percent": False}
          (root / "sim1db2-pair-summary.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          raise SystemExit(0 if passed else 1)
          PYB2SUMMARY

      - name: Stop only services launched by official duck-sim
        if: always()
        shell: bash
        run: |
          export DUCK_SIM_RL="$GITHUB_WORKSPACE/upstream/microduck_rl"
          export PYTHONPATH="$GITHUB_WORKSPACE:$DUCK_SIM_RL/src"
          upstream/microduck/scripts/duck-sim down || true

      - name: Archive only metadata, never pixels, models, media or private data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-1c-and-1d-oem-metadata-only
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/sim-1c-frame-metadata.json
            ${{ runner.temp }}/sim-1c-f2-report.json
            ${{ runner.temp }}/sim-1d-ball-2hz.json
            ${{ runner.temp }}/sim-1d-empty-2hz.json
            ${{ runner.temp }}/sim-1db-ball-negative.json
            ${{ runner.temp }}/sim-1db-empty-negative.json
            ${{ runner.temp }}/sim-1db-home-pair.json
            ${{ runner.temp }}/sim1db2-ball-result.json
            ${{ runner.temp }}/sim1db2-empty-result.json
            ${{ runner.temp }}/sim1db2-pair-summary.json
            ${{ runner.temp }}/sim1db2-ball-sidecar.ndjson
            ${{ runner.temp }}/sim1db2-empty-sidecar.ndjson
