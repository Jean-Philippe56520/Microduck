name: PER-P15-B6-P real pinned BitBake do_package (NOT image/robot)

on:
  pull_request:
    paths:
      - ".github/workflows/per-p15b6-bitbake-package.yml"
      - "scripts/per_p15b6_bitbake_package_gate.py"
      - "tests/test_per_p15b6_bitbake_package_gate.py"
      - "docs/per-p15b6p-real-bitbake-package-2026-11-01.md"
  workflow_dispatch:

concurrency:
  group: p15b6p-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-bitbake-p15b6-package-files-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      P15BP_YOCTO: /tmp/p15b6p-yocto
      P15BP_BASE: /tmp/p15b6p-meta-kwipi-python
      P15BP_ADDON: /tmp/p15b6p-meta-kwipi-passive
      P15BP_SOURCE: /tmp/p15b6p-oem-source
      P15BP_OEM: /tmp/p15b6p-meta-kwipi-oem
      P15BP_RECIPE_ENV: /tmp/p15b6p-recipe-env.txt
      P15BP_DEV_ENV: /tmp/p15b6p-dev-env.txt
      P15BP_SHIP_ENV: /tmp/p15b6p-shipping-env.txt
      P15BP_CHECKSUM: /tmp/p15b6p-effective-checksum.txt
      KAS_WORK_DIR: /tmp/p15b6p-kas-work
      KAS_BUILD_DIR: /tmp/p15b6p-kas-build
      KAS_CLONE_DEPTH: "1"
    steps:
      - name: Checkout exact candidate SHA, without submodule changes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Prove HEAD, pinned OEM gitlinks and negative fixture gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git ls-tree HEAD upstream/microduck | awk '{print $3}')" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test "$(git ls-tree HEAD upstream/microduck_rl | awk '{print $3}')" = "b02fdea4902c2b93b7d34a83a6f05da4ececb7d3"
          test "$(git -C upstream/microduck rev-parse HEAD)" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = "b02fdea4902c2b93b7d34a83a6f05da4ececb7d3"
          python -m compileall -q scripts/per_p15b6_bitbake_package_gate.py tests/test_per_p15b6_bitbake_package_gate.py
          python -m unittest discover -s tests -p 'test_per_p15b6_bitbake_package_gate.py' -v
          python -m unittest discover -s tests -p 'test_per_p15b6_passive_python_addon.py' -v
          python -m unittest discover -s tests -p 'test_per_p15b6_bitbake_unpack_gate.py' -v
          git diff --exit-code -- upstream/
      - name: Stage exact P14B + P15-B6 layers twice, compare all bytes
        run: |
          set -euo pipefail
          python -m scripts.per_p14b_yocto_python_layer stage --output "$P15BP_BASE"
          python -m scripts.per_p15b6_passive_python_addon stage --output "$P15BP_ADDON"
          python -m scripts.per_p14b_yocto_python_layer stage --output "$RUNNER_TEMP/p15b6p-base-second"
          python -m scripts.per_p15b6_passive_python_addon stage --output "$RUNNER_TEMP/p15b6p-addon-second"
          diff -rq "$P15BP_BASE" "$RUNNER_TEMP/p15b6p-base-second"
          diff -rq "$P15BP_ADDON" "$RUNNER_TEMP/p15b6p-addon-second"
          python -m scripts.per_p14b_yocto_python_layer verify --layer "$P15BP_BASE"
          python -m scripts.per_p15b6_passive_python_addon verify --layer "$P15BP_ADDON"
          git diff --exit-code -- upstream/
      - name: Acquire exact immutable official Yocto commit (not main)
        run: |
          set -euo pipefail
          mkdir -p "$P15BP_YOCTO"
          git -C "$P15BP_YOCTO" init -q
          git -C "$P15BP_YOCTO" remote add origin https://github.com/pollen-robotics/microduck_yocto.git
          GIT_TERMINAL_PROMPT=0 git -C "$P15BP_YOCTO" fetch --depth 1 origin 1ee58387810cebb67ae0d634c351d95024483bce
          git -C "$P15BP_YOCTO" checkout --detach FETCH_HEAD
          test "$(git -C "$P15BP_YOCTO" rev-parse HEAD)" = "1ee58387810cebb67ae0d634c351d95024483bce"
      - name: Reuse pinned P11/P12 OEM daemon source provider, metadata only
        run: |
          set -euo pipefail
          python -m scripts.per_p11_v1_source_release \
            --oem-checkout upstream/microduck --output-dir "$P15BP_SOURCE"
          python -m scripts.per_p12_yocto_layer stage \
            --yocto "$P15BP_YOCTO" --source-dir "$P15BP_SOURCE" --output "$P15BP_OEM"
          python -m scripts.per_p12_yocto_layer verify --layer "$P15BP_OEM"
          test "$(git -C "$P15BP_YOCTO" status --porcelain --untracked-files=no)" = ""
          git diff --exit-code -- upstream/
      - name: Install only parser host prerequisites, never relax OS sandbox
        timeout-minutes: 9
        run: |
          set -euo pipefail
          free_kb="$(df -Pk /tmp | awk 'NR==2 {print $4}')"
          echo "Disk free before P15-B6-P metadata/unpack: $free_kb KB"
          test "$free_kb" -ge 16000000 || { echo "P15-B6-P STOP: insufficient disk"; exit 1; }
          echo "P15-B6-P prereq: apt index start $(date -u +%FT%TZ)"
          timeout 120s sudo apt-get update -qq || { echo "P15-B6-P STOP: apt update failed/timeout"; exit 1; }
          echo "P15-B6-P prereq: apt packages start $(date -u +%FT%TZ)"
          timeout 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends chrpath diffstat || { echo "P15-B6-P STOP: apt install failed/timeout"; exit 1; }
          command -v chrpath
          command -v diffstat
          mkdir -p "$KAS_WORK_DIR" "$KAS_BUILD_DIR"
          echo "P15-B6-P prereq: isolated Python venv start $(date -u +%FT%TZ)"
          timeout 30s python -m venv "$RUNNER_TEMP/p15b6p-kas-venv" || { echo "P15-B6-P STOP: venv failed/timeout"; exit 1; }
          echo "P15-B6-P prereq: pinned kas 5.2.0 pip install start $(date -u +%FT%TZ)"
          timeout 120s "$RUNNER_TEMP/p15b6p-kas-venv/bin/pip" install --no-cache-dir --disable-pip-version-check 'kas==5.2.0' || { echo "P15-B6-P STOP: kas install failed/timeout"; exit 1; }
          "$RUNNER_TEMP/p15b6p-kas-venv/bin/kas" --version
          echo "$RUNNER_TEMP/p15b6p-kas-venv/bin" >> "$GITHUB_PATH"
          echo "P15-B6-P prereq: completed $(date -u +%FT%TZ)"
      - name: Temporary KAS overlay; P14C only DEV, P15-B6 not selected
        run: |
          set -euo pipefail
          cat > "$P15BP_YOCTO/kas/per-p15b6p-opt-in.yml" <<EOF
          header:
            version: 14
          repos:
            kwipi:
              path: $P15BP_OEM
              layers:
                .:
            kwipipy:
              path: $P15BP_BASE
              layers:
                .:
            kwipipassive:
              path: $P15BP_ADDON
              layers:
                .:
            kwipidev:
              path: $GITHUB_WORKSPACE/yocto/meta-kwipi-dev-image
              layers:
                .:
          EOF
          test "$(git -C "$P15BP_YOCTO" status --porcelain --untracked-files=no)" = ""
      - name: REAL OEM pinned BitBake parse, effective env and ONLY add-on do_package
        run: |
          set -euo pipefail
          cfg="$P15BP_YOCTO/kas/microduck.yml:$P15BP_YOCTO/kas/per-p15b6p-opt-in.yml"
          timeout 1600s kas shell "$cfg" -c \
            "bitbake -p && bitbake -e kwipi-passive-fixture > $P15BP_RECIPE_ENV && bitbake -e microduck-image-dev > $P15BP_DEV_ENV && bitbake -e microduck-image > $P15BP_SHIP_ENV && bitbake-getvar -r kwipi-passive-fixture -f p15b6.sha256sum --value SRC_URI > $P15BP_CHECKSUM && bitbake -c package kwipi-passive-fixture"
          test -s "$P15BP_RECIPE_ENV"
          test -s "$P15BP_DEV_ENV"
          test -s "$P15BP_SHIP_ENV"
          test -s "$P15BP_CHECKSUM"
          echo "P15-B6-P real BitBake do_package complete; no do_rootfs or image"
      - name: Audit real PKGDEST and exactly five packaged Python source hashes
        run: |
          set -euo pipefail
          python -m scripts.per_p15b6_bitbake_package_gate \
            --root "$GITHUB_WORKSPACE" \
            --base-layer "$P15BP_BASE" \
            --addon-layer "$P15BP_ADDON" \
            --dev-layer "$GITHUB_WORKSPACE/yocto/meta-kwipi-dev-image" \
            --recipe-env "$P15BP_RECIPE_ENV" \
            --dev-env "$P15BP_DEV_ENV" \
            --shipping-env "$P15BP_SHIP_ENV" \
            --checksum-value-file "$P15BP_CHECKSUM" \
            --output "$RUNNER_TEMP/p15b6p-package-proof.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "p15b6p-package-proof.json"
          r = json.loads(p.read_text())
          assert r["status"] == "bitbake_passive_addon_package_files_verified_only"
          assert (r["base_modules_preserved"], r["addon_modules_packaged"]) == (19, 5)
          assert r["package_split_files_verified"]
          assert not any(r[k] for k in (
              "bitbake_task_execution_attested_by_this_script",
              "bitbake_do_package_run_attested_by_this_script",
              "rootfs_installed", "service_installed", "oem_sensor_validated",
              "signed_release", "robot_validated", "dev_image_selects_addon",
              "shipping_image_selects_addon",
          ))
          print("P15-B6-P: real BitBake package split checked; no image/robot")
          PY
          test "$(git -C "$P15BP_YOCTO" status --porcelain --untracked-files=no)" = ""
          git diff --exit-code -- upstream/
      - name: Upload only bounded package JSON proof (no image or raw BitBake env)
        uses: actions/upload-artifact@v4
        with:
          name: p15b6p-real-bitbake-package-proof-only
          path: ${{ runner.temp }}/p15b6p-package-proof.json
          retention-days: 7
