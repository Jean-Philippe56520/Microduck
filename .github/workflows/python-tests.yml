name: Python companion tests
on:
  # Runs once per PR (instead of both push and pull_request on its branch).
  # Public main keeps its post-merge CI; avoids redundant Actions minutes.
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolate all Python tests in a temporary virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/microduck-companion-venv"
          echo "$RUNNER_TEMP/microduck-companion-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/microduck-companion-venv" >> "$GITHUB_ENV"
      - name: Verify virtual environment before installing dependencies
        run: |
          python -c 'import sys; assert sys.prefix != sys.base_prefix, "not in a venv"; print("Python virtual environment OK")'
          # No Qwen download, photo upload, local PC tunnel or remote model access.
      - name: F5 v2 PC-only image-preprocessing test dependency
        run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q microduck_companion tests
      - name: N3 non-destructive SQLite writer/source audit (no database opened)
        run: |
          python -m scripts.n3_sqlite_audit --output "$RUNNER_TEMP/n3-sqlite-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n3-sqlite-source-inventory
          path: ${{ runner.temp }}/n3-sqlite-audit.json
      - name: Cat-A2b-G real Tk GUI smoke in a virtual Linux display
        run: |
          # Synthetic JPEGs ONLY. Do not fetch/upload any operator images.
          # Requires an actual X server and Tcl/Tk, not a mocked GUI.
          # No robot, camera, model, Qwen, database, network or motor.
          command -v xvfb-run
          python -c 'import tkinter; from PIL import ImageTk; print("Tk and Pillow available")'
          timeout 45s xvfb-run -a python -m unittest discover -s tests -p 'gui_smoke_cata2b_editor.py' -v
      - name: F5 v2 launcher PowerShell syntax (parse only; never run Ollama)
        run: |
          pwsh -NoProfile -NonInteractive -Command '$tokens=$null; $parseErrors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/kwipi-vision-test.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null; if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Host $_.Message }; exit 1 }; Write-Host "PowerShell parser OK; Windows runtime not tested"'
      - run: sh -n scripts/sim-smoke.sh
      - name: P2a two mock-only offline sessions
        run: |
          python -m microduck_companion.mock_cycle_demo --database "$RUNNER_TEMP/p2a-memory.sqlite3" --session session-a
          python -m microduck_companion.mock_cycle_demo --database "$RUNNER_TEMP/p2a-memory.sqlite3" --session session-b
      - name: F1-D integrated passive Unix fixture across two fresh processes
        run: |
          # Both calls use a real local Unix fixture socket, but no robotd,
          # mediad, MuJoCo, media recording, or motor actions.
          python -m microduck_companion.passive_demo --database "$RUNNER_TEMP/f1d-memory.sqlite3" --session first
          python -m microduck_companion.passive_demo --database "$RUNNER_TEMP/f1d-memory.sqlite3" --session second
      - name: F2-D two separate mock Unix processes and measured host budgets
        run: |
          # Two independent Python processes; SQLite is the only shared state.
          # CPU, p50/p95 and RSS are HOST measurements, not RK3566 estimates.
          python -m microduck_companion.passive_resilience_demo --database "$RUNNER_TEMP/f2d-memory.sqlite3" --session first
          python -m microduck_companion.passive_resilience_demo --database "$RUNNER_TEMP/f2d-memory.sqlite3" --session second
      - name: F3-A mock visual evaluation protocol (no media or model)
        run: |
          python -m microduck_companion.visual_dataset_demo
      - name: F3-C mock mediad notification shapes and audio-cue contract
        run: |
          # OEM-shaped JSON only. No WebRTC, media.frame, real audio or motor.
          python -m microduck_companion.passive_media_demo
      - name: F3-E public-photo review ledger (no human votes)
        run: |
          python -m microduck_companion.f3e_demo
      - name: F4-A two independent mock-only SQLite memory processes
        run: |
          # Same DB between processes, F1-C/F2-C labels and P2a feedback only.
          # Never opens a camera, talks to a PC, or calls robotd.
          python -m microduck_companion.f4a_memory_demo --database "$RUNNER_TEMP/f4a-knowledge.sqlite3" --session first
          python -m microduck_companion.f4a_memory_demo --database "$RUNNER_TEMP/f4a-knowledge.sqlite3" --session second
      - name: F4-B two independent mock-only spatial SQLite processes
        run: |
          # Toy marker in two artificial frames; no real map, robot pose,
          # floor safety, socket, sensor, camera, or actuator is involved.
          python -m microduck_companion.f4b_spatial_demo --database "$RUNNER_TEMP/f4b-fictive-spatial.sqlite3" --session first
          python -m microduck_companion.f4b_spatial_demo --database "$RUNNER_TEMP/f4b-fictive-spatial.sqlite3" --session second
      - name: F4-C silent social cues and cross-process SQLite cooldown
        run: |
          # Mock-only bark label and operator scenario, NOT microphone input.
          # No speaker, camera, robotd or motor I/O; both processes share DB.
          python -m microduck_companion.f4c_social_demo --database "$RUNNER_TEMP/f4c-social.sqlite3" --session first
          python -m microduck_companion.f4c_social_demo --database "$RUNNER_TEMP/f4c-social.sqlite3" --session second
      - name: F4-D voluntary mock token and revocation across two processes
        run: |
          # PUBLIC test-only key/token bytes, never use these on the robot.
          # No real names, faces, voices, BLE/NFC tags, camera or actuators.
          python -m microduck_companion.f4d_optin_demo --database "$RUNNER_TEMP/f4d-only-fictional-identities.sqlite3" --session first
          python -m microduck_companion.f4d_optin_demo --database "$RUNNER_TEMP/f4d-only-fictional-identities.sqlite3" --session second
      - name: F5-A optional PC contract with fictional offline answer
        run: |
          # No LAN access, Ollama/Qwen, camera, speaker, servo or motor action.
          python -m microduck_companion.f5a_contract_demo
      - name: F5-B loopback HTTP fixture and offline model comparison plan
        run: |
          # Binds only to local 127.0.0.1; no Ollama/Qwen or outside requests.
          python -m microduck_companion.f5b_transport_demo
          python -m microduck_companion.f5b_benchmark
      - name: F5-C persistent opt-in quota across independent mock processes
        run: |
          # Two fresh Python processes share only an anonymous SQLite quota.
          # No external network, real Ollama/Qwen, sensor, motor or speaker.
          python -m microduck_companion.f5c_policy_demo --database "$RUNNER_TEMP/f5c-pc-quota.sqlite3" --session first
          python -m microduck_companion.f5c_policy_demo --database "$RUNNER_TEMP/f5c-pc-quota.sqlite3" --session second
      - name: F5-D offline adversarial Qwen response contract
        run: |
          # Forged JSON only: no real Ollama, no external network or motors.
          python -m microduck_companion.f5d_adversarial_demo
      - name: F6-A offline Yocto mount and OEM interface preflight
        run: |
          # Uses fictional /proc/mountinfo strings: no disk, systemd, network,
          # daemon socket, camera, ToF, Ollama, motor or physical hardware.
          python -m microduck_companion.f6a_preflight_demo
      - name: F6-B parity experiment Python vs isolated Rust scorer
        run: |
          # Uses ONLY GitHub runner toolchain, no extra crates, no Yocto,
          # OEM services, sensors, external network, LLM or motor commands.
          rustc --version
          rustc --edition=2021 --test experiments/f6b/passive_score.rs -o "$RUNNER_TEMP/f6b-rust-tests"
          "$RUNNER_TEMP/f6b-rust-tests"
          rustc --edition=2021 -O experiments/f6b/passive_score.rs -o "$RUNNER_TEMP/f6b-score"
          python -m microduck_companion.f6b_score_probe --rust-bin "$RUNNER_TEMP/f6b-score" --benchmark
          # Independent host process RSS. Packaging differs: NOT a fair
          # whole-brain, battery, ARM, or hardware-resource comparison.
          /usr/bin/time -f "F6B python_host_elapsed_s=%e python_host_peak_rss_kib=%M" python -m microduck_companion.f6b_score_probe --python-only-bench
          /usr/bin/time -f "F6B rust_host_elapsed_s=%e rust_host_peak_rss_kib=%M" "$RUNNER_TEMP/f6b-score" --bench
      - name: F6-C offline cycle and event budgets with host resource evidence
        run: |
          # Full mock F1-B Unix read -> F2 brain -> SQLite F1-C/F2-C,
          # with F6-C pre-read/pre-memory quotas. NO OEM/PC/robot hardware.
          python -m microduck_companion.f6c_offline_budget_demo
      - name: F6-D read-only audit plan and denied-movement shell guard
        run: |
          # The CI host is NOT a Microduck. No hardware survey or telemetry.
          sh -n scripts/resource-audit.sh
          sh scripts/resource-audit.sh --plan
          python -m microduck_companion.f6d_audit_plan_demo
          if sh scripts/resource-audit.sh --phase movement --operator-confirmed; then
            echo "F6-D motion must be rejected" >&2
            exit 1
          fi
      - name: M1-A compact image/audio patterns across two independent mock processes
        run: |
          # Synthetic grayscale and PCM tone only. No camera, microphone,
          # person, animal, real Ollama, paid API, OEM socket or motors.
          python -m microduck_companion.m1a_multimodal_demo --database "$RUNNER_TEMP/m1a-mock-patterns.sqlite3" --session first
          python -m microduck_companion.m1a_multimodal_demo --database "$RUNNER_TEMP/m1a-mock-patterns.sqlite3" --session second
      - name: M1-B configurable multiview memory and 512-cycle CPU host probe
        run: |
          # Only deterministic image/tone fixtures; no robot, sound capture,
          # camera, PC inference, real identifier or motor command.
          python -m microduck_companion.m1b_multiview_demo --database "$RUNNER_TEMP/m1b-fixture.sqlite3" --session first
          python -m microduck_companion.m1b_multiview_demo --database "$RUNNER_TEMP/m1b-fixture.sqlite3" --session second
          python -m microduck_companion.m1b_multiview_demo --host-scaling
