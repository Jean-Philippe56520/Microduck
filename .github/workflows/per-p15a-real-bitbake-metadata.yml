name: PER-P15A-M pinned real BitBake metadata (NO do_package/rootfs/robot)

on:
  pull_request:
    branches:
      - feature/per-p14c-dev-image-opt-in
      - main
    paths:
      - ".github/workflows/per-p15a-real-bitbake-metadata.yml"
      - "yocto/meta-kwipi-p15-readonly/**"
      - "scripts/per_p15a_bitbake_env_gate.py"
      - "tests/test_per_p15a_bitbake_env_gate.py"
      - "docs/per-p15a-readonly-health-probe-2026-10-31.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pinned-bitbake-metadata-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 38
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      P15M_YOCTO: /tmp/p15m-yocto
      P15M_SOURCE: /tmp/p15m-source
      P15M_OEM: /tmp/p15m-meta-kwipi
      P15M_PY: /tmp/p15m-meta-kwipi-python
      KAS_WORK_DIR: /tmp/p15m-kas-work
      KAS_BUILD_DIR: /tmp/p15m-kas-build
      KAS_CLONE_DEPTH: "1"
      P15M_RECIPE_ENV: /tmp/p15m-effective-recipe-env.txt
      P15M_DEV_ENV: /tmp/p15m-effective-dev-image-env.txt
      P15M_SHIP_ENV: /tmp/p15m-effective-shipping-env.txt
      P15M_APPENDS: /tmp/p15m-effective-appends.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Check reviewed source and negative fixtures without BitBake
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "\${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C upstream/microduck rev-parse HEAD)" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = "b02fdea4902c2b93b7d34a83a6f05da4ececb7d3"
          python -m unittest discover -s tests -p 'test_per_p15a_bitbake_env_gate.py' -v
          python -m unittest discover -s tests -p 'test_per_p15a_readonly_probe.py' -v
          python -m unittest discover -s tests -p 'test_per_p14c_dev_image_env_gate.py' -v
          git diff --exit-code -- upstream/
      - name: Acquire only exact pinned official Yocto checkout
        run: |
          set -euo pipefail
          mkdir -p "$P15M_YOCTO"
          git -C "$P15M_YOCTO" init -q
          git -C "$P15M_YOCTO" remote add origin https://github.com/pollen-robotics/microduck_yocto.git
          GIT_TERMINAL_PROMPT=0 git -C "$P15M_YOCTO" fetch --depth 1 origin 1ee58387810cebb67ae0d634c351d95024483bce
          git -C "$P15M_YOCTO" checkout --detach FETCH_HEAD
          test "$(git -C "$P15M_YOCTO" rev-parse HEAD)" = "1ee58387810cebb67ae0d634c351d95024483bce"
      - name: Reuse P11 P12 and P14B source-only staging unmodified
        run: |
          set -euo pipefail
          python -m scripts.per_p11_v1_source_release \
            --oem-checkout upstream/microduck --output-dir "$P15M_SOURCE"
          python -m scripts.per_p12_yocto_layer stage \
            --yocto "$P15M_YOCTO" --source-dir "$P15M_SOURCE" --output "$P15M_OEM"
          python -m scripts.per_p14b_yocto_python_layer stage --output "$P15M_PY"
          python -m scripts.per_p12_yocto_layer verify --layer "$P15M_OEM"
          python -m scripts.per_p14b_yocto_python_layer verify --layer "$P15M_PY"
          git diff --exit-code -- upstream/
          test "$(git -C "$P15M_YOCTO" status --porcelain --untracked-files=no)" = ""
      - name: Install official host parser prerequisites without disabling sandbox
        run: |
          set -euo pipefail
          free_kb="$(df -Pk /tmp | awk 'NR==2 {print $4}')"
          echo "Available disk before P15A-M parsing: $free_kb KB"
          test "$free_kb" -ge 6000000 || { echo "P15A-M STOP: insufficient disk"; exit 1; }
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends chrpath diffstat
          python -m venv "$RUNNER_TEMP/kwipi-p15a-m-kas-venv"
          "$RUNNER_TEMP/kwipi-p15a-m-kas-venv/bin/pip" install --no-cache-dir --disable-pip-version-check 'kas==5.2.0'
          mkdir -p "$KAS_WORK_DIR" "$KAS_BUILD_DIR"
          echo "$RUNNER_TEMP/kwipi-p15a-m-kas-venv/bin" >> "$GITHUB_PATH"
      - name: Compose four opt-in metadata layers without OEM tracked edits
        run: |
          set -euo pipefail
          cat > "$P15M_YOCTO/kas/per-p15a-m-opt-in.yml" <<EOF
          header:
            version: 14
          repos:
            kwipi:
              path: $P15M_OEM
              layers:
                .:
            kwipipy:
              path: $P15M_PY
              layers:
                .:
            kwipidev:
              path: $GITHUB_WORKSPACE/yocto/meta-kwipi-dev-image
              layers:
                .:
            kwipip15:
              path: $GITHUB_WORKSPACE/yocto/meta-kwipi-p15-readonly
              layers:
                .:
          EOF
          test "$(git -C "$P15M_YOCTO" status --porcelain --untracked-files=no)" = ""
      - name: Execute REAL BitBake parse, recipe and dev/shipping -e; no packages
        run: |
          set -euo pipefail
          cfg="$P15M_YOCTO/kas/microduck.yml:$P15M_YOCTO/kas/per-p15a-m-opt-in.yml"
          timeout 1600s kas shell "$cfg" -c \
            "bitbake -p && bitbake -e kwipi-readonly-probe > $P15M_RECIPE_ENV && bitbake -e microduck-image-dev > $P15M_DEV_ENV && bitbake -e microduck-image > $P15M_SHIP_ENV && bitbake-layers show-appends > $P15M_APPENDS"
          test -s "$P15M_RECIPE_ENV"
          test -s "$P15M_DEV_ENV"
          test -s "$P15M_SHIP_ENV"
          test -s "$P15M_APPENDS"
      - name: Check exact P15A/P14C OEM metadata, drop complete -e outputs
        run: |
          set -euo pipefail
          python -m scripts.per_p15a_bitbake_env_gate \
            --recipe-env "$P15M_RECIPE_ENV" \
            --dev-env "$P15M_DEV_ENV" \
            --shipping-env "$P15M_SHIP_ENV" \
            --appends "$P15M_APPENDS" \
            --p15-layer "$GITHUB_WORKSPACE/yocto/meta-kwipi-p15-readonly" \
            --dev-layer "$GITHUB_WORKSPACE/yocto/meta-kwipi-dev-image" \
            --py-layer "$P15M_PY" \
            --yocto "$P15M_YOCTO" \
            --root "$GITHUB_WORKSPACE" \
            --report "$RUNNER_TEMP/p15a-metadata-only-proof.json"
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "p15a-metadata-only-proof.json"
          r = json.loads(path.read_text())
          assert r["status"] == "real_bitbake_p15a_metadata_dev_only_verified"
          assert r["p15a_dev_count"] == 1 and r["p15a_shipping_count"] == 0
          assert r["systemd_auto_enable"] == "disable"
          assert not any(r[x] for x in (
              "bitbake_package_run", "rootfs_built", "service_installed",
              "signed_release", "robot_validated",
          ))
          print("P15A-M: real metadata parsed; no do_package/rootfs/RAUC/robot")
          PY
          git diff --exit-code -- upstream/
          test "$(git -C "$P15M_YOCTO" status --porcelain --untracked-files=no)" = ""
      - name: Upload only bounded metadata proof, never raw -e or source media
        uses: actions/upload-artifact@v4
        with:
          name: kwipi-p15a-pinned-bitbake-metadata-only
          path: \${{ runner.temp }}/p15a-metadata-only-proof.json
          retention-days: 7
