name: Kwipi candidate region appearance on seventh disjoint COCO (host)
on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/region_appearance_*.py"
      - "experiments/test_region_appearance_probe.py"
      - ".github/workflows/region-appearance-seventh-coco.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appearance-host:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing pinned host YOLOX dependencies only
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==1.26.4 onnxruntime==1.21.0
      - name: Run independent synthetic positives and negatives
        run: python -m unittest experiments.test_region_appearance_probe -v
      - name: Download pinned COCO annotations and unchanged YOLOX Nano
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 \
            --output "$RUNNER_TEMP/instances_val2017.json" \
            "https://huggingface.co/datasets/LibreYOLO/coco2017/resolve/main/instances_val2017.json"
          echo "e8c7f7908f1d7278341fae127d0da654f102f11bd7b21d8aeefa635b8c810b6f  $RUNNER_TEMP/instances_val2017.json" | sha256sum --check
          curl --fail --location --retry 2 --max-time 120 \
            --output "$RUNNER_TEMP/yolox_nano.onnx" \
            "https://huggingface.co/skillsafe-ai/yolox-nano/resolve/8e308810ede488f742901a4ac597dc7796798e46/yolox_nano.onnx"
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  $RUNNER_TEMP/yolox_nano.onnx" | sha256sum --check
      - name: Compare color and rectangle geometry against independent COCO polygons
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          COCO_VAL_ANNOTATIONS: ${{ runner.temp }}/instances_val2017.json
          YOLOX_MODEL: ${{ runner.temp }}/yolox_nano.onnx
          APP_RESULTS: ${{ runner.temp }}/region-appearance-results.json
        run: python -m experiments.region_appearance_seventh_coco
      - name: Preserve only structured numerical report without photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwipi-appearance-seventh-coco-json
          path: ${{ runner.temp }}/region-appearance-results.json
          if-no-files-found: warn
