name: PER-P4 300 public COCO photos YOLO26 nano versus YOLO11 (host-only)

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/per_p4_yolo26_coco300.py"
      - "tests/test_per_p4_yolo26_coco300.py"
      - "docs/per-p4-yolo26-coco300-prereg-2026-10-30.md"
      - ".github/workflows/per-p4-yolo26-coco300.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-coco300:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "2"
      YOLO_CONFIG_DIR: /tmp/kwipi-per-p4-ultralytics-config
      ULTRALYTICS_AUTOINSTALL: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Confirm immutable OEM gitlinks and no media assets
        run: |
          set -euo pipefail
          git ls-tree HEAD upstream/microduck | grep -F '942e58e3aa6dbb28e7037203fff11866122c7567'
          git ls-tree HEAD upstream/microduck_rl | grep -F 'b02fdea4902c2b93b7d34a83a6f05da4ececb7d3'
          test ! -e kwipi_photos_privees_tests_2026-10-30.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned host-only CPU inference and COCO evaluation tools
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/p4"
          echo "$RUNNER_TEMP/p4/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/p4/bin/python" -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'Pillow==11.3.0'
          "$RUNNER_TEMP/p4/bin/python" -m pip install --disable-pip-version-check \
            'torch==2.5.1' 'torchvision==0.20.1' \
            --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/p4/bin/python" -m pip install --disable-pip-version-check \
            'ultralytics==8.4.192' 'pycocotools==2.0.10'
      - name: Synthetic positive/negative contract tests first (no images, no model)
        run: |
          python -m compileall -q experiments/per_p4_yolo26_coco300.py tests/test_per_p4_yolo26_coco300.py
          python -m unittest discover -s tests -p 'test_per_p4_yolo26_coco300.py' -v
      - name: Download exactly 3 reviewed official weights and immutable public GT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p4-models"
          curl --fail --location --retry 3 --max-time 180 \
            --output "$RUNNER_TEMP/p4-models/yolo11n.pt" \
            "https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11n.pt"
          echo "0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1  $RUNNER_TEMP/p4-models/yolo11n.pt" | sha256sum --check
          curl --fail --location --retry 3 --max-time 180 \
            --output "$RUNNER_TEMP/p4-models/yolo26n.pt" \
            "https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.pt"
          echo "9b09cc8bf347f0fc8a5f7657480587f25db09b34bf33b0652110fb03a8ad4fef  $RUNNER_TEMP/p4-models/yolo26n.pt" | sha256sum --check
          curl --fail --location --retry 3 --max-time 180 \
            --output "$RUNNER_TEMP/p4-models/yolo26n-seg.pt" \
            "https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n-seg.pt"
          echo "361fbfabab285c3237700b6bb91d7ecfa602cd945fffda8dbe1242829b71e73f  $RUNNER_TEMP/p4-models/yolo26n-seg.pt" | sha256sum --check
          curl --fail --location --retry 3 --max-time 180 \
            --output "$RUNNER_TEMP/p4-coco-val2017.json" \
            "https://huggingface.co/datasets/LibreYOLO/coco2017/resolve/main/instances_val2017.json"
          echo "e8c7f7908f1d7278341fae127d0da654f102f11bd7b21d8aeefa635b8c810b6f  $RUNNER_TEMP/p4-coco-val2017.json" | sha256sum --check
      - name: Inspect remaining dataset licensing and target counts before any inference
        run: |
          python - "$RUNNER_TEMP/p4-coco-val2017.json" <<'PY'
          import collections,json,sys
          from experiments.vis_att2_eighth_coco_category_vs_region import eighth_disjoint
          from microduck_companion.cata2_bbox_eval import COCO_IDS
          raw=open(sys.argv[1],"rb").read()
          last,data,_,prior=eighth_disjoint(raw)
          excluded=set(prior)|{c.image_id for c in last}
          images={v["id"]:v for v in data["images"] if v["id"] not in excluded}
          licensed={v["id"]:v["name"] for v in data["licenses"]}
          observed=collections.defaultdict(lambda:collections.defaultdict(set))
          for a in data["annotations"]:
              if a.get("image_id") not in images or a.get("iscrowd")!=0 or not a.get("segmentation"):continue
              for name,cat in COCO_IDS.items():
                  if a.get("category_id")==cat:
                      photo=images[a["image_id"]]
                      observed[name][licensed.get(photo.get("license"),"UNKNOWN")].add(a["image_id"])
          for name in COCO_IDS:
              print("PHOTO_LICENSE_COUNTS",name,{k:len(ids) for k,ids in observed[name].items()},flush=True)
          PY
      - name: Evaluate the same 300 new approved photos and instance masks
        run: |
          set -euo pipefail
          timeout 2700s python -m experiments.per_p4_yolo26_coco300 \
            --annotations "$RUNNER_TEMP/p4-coco-val2017.json" \
            --weights-dir "$RUNNER_TEMP/p4-models" \
            --report "$RUNNER_TEMP/p4-coco300-numeric-only.json"
          python - <<'PY'
          import json,os,pathlib
          report=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "p4-coco300-numeric-only.json").read_text())
          assert report["images"] == 300
          assert report["target_per_class"] == 40 and report["targetfree"] == 100
          assert report["overlap_historical_ids"] == 0
          assert report["excluded_historical_image_ids"] == 132
          assert len(set(report["ids"])) == 300
          assert len(report["results"]) == 3
          assert {r["model"] for r in report["results"]} == {"yolo11n.pt","yolo26n.pt","yolo26n-seg.pt"}
          assert not report["actual_RK3566_or_NPU_test"]
          assert not report["private_media_saved"] and not report["robot_motion"]
          print("NUMERIC EVIDENCE PASS: 300 new licensed photos; 3 actual model passes; no robot")
          PY
      - name: Preserve only the numeric comparison and IDs, never images or weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-p4-coco300-yolo-nano-public-numeric-only
          path: ${{ runner.temp }}/p4-coco300-numeric-only.json
          if-no-files-found: warn
          retention-days: 14
