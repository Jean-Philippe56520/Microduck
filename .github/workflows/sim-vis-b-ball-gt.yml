name: SIM-VIS-B static ball ground truth
on:
  push:
    branches:
      - feat/sim-vis-b-ball-groundtruth-20261029
    paths:
      - ".github/workflows/sim-vis-b-ball-gt.yml"
      - "microduck_companion/sim_ball_segmentation_gt.py"
      - "tests/test_sim_ball_segmentation_gt.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-vis-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MUJOCO_GL: osmesa
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "upstream/microduck_rl/uv.lock"

      - name: Verify exact OEM code pins and source-only, no motor process
        run: |
          set -euo pipefail
          test "$(git -C upstream/microduck rev-parse HEAD)" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = "b02fdea4902c2b93b7d34a83a6f05da4ececb7d3"
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene_apartment.xml
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/apartment.xml
          test ! -e /tmp/sim-vis-b.json
          printf 'Pinned manufacturer XML and camera, no robotd service launched\n'

      - name: Small isolated MuJoCo renderer and frozen Cat-A dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libgl1-mesa-dri
          uv python install 3.12
          uv venv --python 3.12 "$RUNNER_TEMP/sim-vis-b-venv"
          uv pip install --python "$RUNNER_TEMP/sim-vis-b-venv/bin/python" \
            'mujoco==3.10.0' 'numpy==2.5.4' 'onnxruntime==1.28.0' \
            'Pillow==11.3.0' 'PyOpenGL==3.1.10'

      - name: Retrieve exactly the approved public Apache-2.0 YOLOX weights
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 90 \
            'https://huggingface.co/skillsafe-ai/yolox-nano/resolve/8e308810ede488f742901a4ac597dc7796798e46/yolox_nano.onnx' \
            -o "$RUNNER_TEMP/sim-vis-b-yolox.onnx"
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  $RUNNER_TEMP/sim-vis-b-yolox.onnx" | sha256sum -c -

      - name: Independent segmentation witness tests (positive and negative)
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          "$RUNNER_TEMP/sim-vis-b-venv/bin/python" -m unittest discover \
            -s tests -p test_sim_ball_segmentation_gt.py -v
          "$RUNNER_TEMP/sim-vis-b-venv/bin/python" -m compileall -q \
            microduck_companion/sim_ball_segmentation_gt.py tests/test_sim_ball_segmentation_gt.py

      - name: Render two frozen OEM scene views, match existing YOLOX against pixel GT
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          "$RUNNER_TEMP/sim-vis-b-venv/bin/python" -m microduck_companion.sim_ball_segmentation_gt \
            --scene-path "$GITHUB_WORKSPACE/upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene_apartment.xml" \
            --model-path "$RUNNER_TEMP/sim-vis-b-yolox.onnx" \
            --output "$RUNNER_TEMP/sim-vis-b-result.json" \
            --authorize-static-oem-render

      - name: Preserve only report, never raw images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-vis-b-static-ball-evidence
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/sim-vis-b-result.json
