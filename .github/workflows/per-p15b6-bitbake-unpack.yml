name: PER-P15-B6-M real pinned BitBake metadata + unpack (NOT package/image)

on:
  pull_request:
    paths:
      - ".github/workflows/per-p15b6-bitbake-unpack.yml"
      - "scripts/per_p15b6_bitbake_unpack_gate.py"
      - "tests/test_per_p15b6_bitbake_unpack_gate.py"
      - "scripts/per_p15b6_passive_python_addon.py"
      - "docs/per-p15b6m-real-bitbake-metadata-unpack-2026-11-01.md"
  workflow_dispatch:

concurrency:
  group: p15b6m-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-bitbake-p15b6-metadata-unpack-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 36
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      P15BM_YOCTO: /tmp/p15b6m-yocto
      P15BM_BASE: /tmp/p15b6m-meta-kwipi-python
      P15BM_ADDON: /tmp/p15b6m-meta-kwipi-passive
      P15BM_SOURCE: /tmp/p15b6m-oem-source
      P15BM_OEM: /tmp/p15b6m-meta-kwipi-oem
      P15BM_RECIPE_ENV: /tmp/p15b6m-recipe-env.txt
      P15BM_DEV_ENV: /tmp/p15b6m-dev-env.txt
      P15BM_SHIP_ENV: /tmp/p15b6m-shipping-env.txt
      P15BM_CHECKSUM: /tmp/p15b6m-effective-checksum.txt
      KAS_WORK_DIR: /tmp/p15b6m-kas-work
      KAS_BUILD_DIR: /tmp/p15b6m-kas-build
      KAS_CLONE_DEPTH: "1"
    steps:
      - name: Checkout exact candidate SHA, without submodule changes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Prove HEAD, pinned OEM gitlinks and negative fixture gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git ls-tree HEAD upstream/microduck | awk '{print $3}')" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test "$(git ls-tree HEAD upstream/microduck_rl | awk '{print $3}')" = "b02fdea4902c2b93b7d34a83a6f05da4ececb7d3"
          test "$(git -C upstream/microduck rev-parse HEAD)" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = "b02fdea4902c2b93b7d34a83a6f05da4ececb7d3"
          python -m compileall -q scripts/per_p15b6_bitbake_unpack_gate.py tests/test_per_p15b6_bitbake_unpack_gate.py
          python -m unittest discover -s tests -p 'test_per_p15b6_bitbake_unpack_gate.py' -v
          python -m unittest discover -s tests -p 'test_per_p15b6_passive_python_addon.py' -v
          git diff --exit-code -- upstream/
      - name: Stage exact P14B + P15-B6 layers twice, compare all bytes
        run: |
          set -euo pipefail
          python -m scripts.per_p14b_yocto_python_layer stage --output "$P15BM_BASE"
          python -m scripts.per_p15b6_passive_python_addon stage --output "$P15BM_ADDON"
          python -m scripts.per_p14b_yocto_python_layer stage --output "$RUNNER_TEMP/p15b6m-base-second"
          python -m scripts.per_p15b6_passive_python_addon stage --output "$RUNNER_TEMP/p15b6m-addon-second"
          diff -rq "$P15BM_BASE" "$RUNNER_TEMP/p15b6m-base-second"
          diff -rq "$P15BM_ADDON" "$RUNNER_TEMP/p15b6m-addon-second"
          python -m scripts.per_p14b_yocto_python_layer verify --layer "$P15BM_BASE"
          python -m scripts.per_p15b6_passive_python_addon verify --layer "$P15BM_ADDON"
          git diff --exit-code -- upstream/
      - name: Acquire exact immutable official Yocto commit (not main)
        run: |
          set -euo pipefail
          mkdir -p "$P15BM_YOCTO"
          git -C "$P15BM_YOCTO" init -q
          git -C "$P15BM_YOCTO" remote add origin https://github.com/pollen-robotics/microduck_yocto.git
          GIT_TERMINAL_PROMPT=0 git -C "$P15BM_YOCTO" fetch --depth 1 origin 1ee58387810cebb67ae0d634c351d95024483bce
          git -C "$P15BM_YOCTO" checkout --detach FETCH_HEAD
          test "$(git -C "$P15BM_YOCTO" rev-parse HEAD)" = "1ee58387810cebb67ae0d634c351d95024483bce"
      - name: Reuse pinned P11/P12 OEM daemon source provider, metadata only
        run: |
          set -euo pipefail
          python -m scripts.per_p11_v1_source_release \
            --oem-checkout upstream/microduck --output-dir "$P15BM_SOURCE"
          python -m scripts.per_p12_yocto_layer stage \
            --yocto "$P15BM_YOCTO" --source-dir "$P15BM_SOURCE" --output "$P15BM_OEM"
          python -m scripts.per_p12_yocto_layer verify --layer "$P15BM_OEM"
          test "$(git -C "$P15BM_YOCTO" status --porcelain --untracked-files=no)" = ""
          git diff --exit-code -- upstream/
      - name: Install only parser host prerequisites, never relax OS sandbox
        timeout-minutes: 9
        run: |
          set -euo pipefail
          free_kb="$(df -Pk /tmp | awk 'NR==2 {print $4}')"
          echo "Disk free before P15-B6-M metadata/unpack: $free_kb KB"
          test "$free_kb" -ge 6000000 || { echo "P15-B6-M STOP: insufficient disk"; exit 1; }
          echo "P15-B6-M prereq: apt index start $(date -u +%FT%TZ)"
          timeout 120s sudo apt-get update -qq || { echo "P15-B6-M STOP: apt update failed/timeout"; exit 1; }
          echo "P15-B6-M prereq: apt packages start $(date -u +%FT%TZ)"
          timeout 240s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends chrpath diffstat || { echo "P15-B6-M STOP: apt install failed/timeout"; exit 1; }
          command -v chrpath
          command -v diffstat
          mkdir -p "$KAS_WORK_DIR" "$KAS_BUILD_DIR"
          echo "P15-B6-M prereq: isolated Python venv start $(date -u +%FT%TZ)"
          timeout 30s python -m venv "$RUNNER_TEMP/p15b6m-kas-venv" || { echo "P15-B6-M STOP: venv failed/timeout"; exit 1; }
          echo "P15-B6-M prereq: pinned kas 5.2.0 pip install start $(date -u +%FT%TZ)"
          timeout 120s "$RUNNER_TEMP/p15b6m-kas-venv/bin/pip" install --no-cache-dir --disable-pip-version-check 'kas==5.2.0' || { echo "P15-B6-M STOP: kas install failed/timeout"; exit 1; }
          "$RUNNER_TEMP/p15b6m-kas-venv/bin/kas" --version
          echo "$RUNNER_TEMP/p15b6m-kas-venv/bin" >> "$GITHUB_PATH"
          echo "P15-B6-M prereq: completed $(date -u +%FT%TZ)"
      - name: Temporary KAS overlay; P14C only DEV, P15-B6 not selected
        run: |
          set -euo pipefail
          cat > "$P15BM_YOCTO/kas/per-p15b6m-opt-in.yml" <<EOF
          header:
            version: 14
          repos:
            kwipi:
              path: $P15BM_OEM
              layers:
                .:
            kwipipy:
              path: $P15BM_BASE
              layers:
                .:
            kwipipassive:
              path: $P15BM_ADDON
              layers:
                .:
            kwipidev:
              path: $GITHUB_WORKSPACE/yocto/meta-kwipi-dev-image
              layers:
                .:
          EOF
          test "$(git -C "$P15BM_YOCTO" status --porcelain --untracked-files=no)" = ""
      - name: REAL OEM pinned BitBake parse, effective env and ONLY add-on do_unpack
        run: |
          set -euo pipefail
          cfg="$P15BM_YOCTO/kas/microduck.yml:$P15BM_YOCTO/kas/per-p15b6m-opt-in.yml"
          timeout 1400s kas shell "$cfg" -c \
            "bitbake -p && bitbake -e kwipi-passive-fixture > $P15BM_RECIPE_ENV && bitbake -e microduck-image-dev > $P15BM_DEV_ENV && bitbake -e microduck-image > $P15BM_SHIP_ENV && bitbake-getvar -r kwipi-passive-fixture -f p15b6.sha256sum --value SRC_URI > $P15BM_CHECKSUM && bitbake -c unpack kwipi-passive-fixture"
          test -s "$P15BM_RECIPE_ENV"
          test -s "$P15BM_DEV_ENV"
          test -s "$P15BM_SHIP_ENV"
          test -s "$P15BM_CHECKSUM"
          echo "P15-B6-M real BitBake parsed and unpacked source, NOT do_package or rootfs"
      - name: Audit real effective metadata and five unpacked source hashes
        run: |
          set -euo pipefail
          python -m scripts.per_p15b6_bitbake_unpack_gate \
            --root "$GITHUB_WORKSPACE" \
            --base-layer "$P15BM_BASE" \
            --addon-layer "$P15BM_ADDON" \
            --dev-layer "$GITHUB_WORKSPACE/yocto/meta-kwipi-dev-image" \
            --recipe-env "$P15BM_RECIPE_ENV" \
            --dev-env "$P15BM_DEV_ENV" \
            --shipping-env "$P15BM_SHIP_ENV" \
            --checksum-value-file "$P15BM_CHECKSUM" \
            --output "$RUNNER_TEMP/p15b6m-unpack-proof.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "p15b6m-unpack-proof.json"
          r = json.loads(p.read_text())
          assert r["status"] == "bitbake_metadata_and_unpack_verified_only"
          assert (r["base_python_modules_unchanged"], r["addon_python_modules_unpacked"]) == (19, 5)
          assert r["unpacked_source_bytes_verified"]
          assert not any(r[k] for k in (
              "bitbake_do_install_run", "bitbake_do_package_run", "rootfs_installed",
              "service_installed", "real_oem_observation", "signed_release",
              "physical_robot_verified", "dev_image_selects_addon",
              "shipping_image_selects_addon",
          ))
          print("P15-B6-M: real unpack/source check PASS; no package, image or robot")
          PY
          test "$(git -C "$P15BM_YOCTO" status --porcelain --untracked-files=no)" = ""
          git diff --exit-code -- upstream/
      - name: Upload only bounded JSON proof (no raw BitBake environment or image)
        uses: actions/upload-artifact@v4
        with:
          name: p15b6m-real-bitbake-unpack-proof-only
          path: ${{ runner.temp }}/p15b6m-unpack-proof.json
          retention-days: 7
