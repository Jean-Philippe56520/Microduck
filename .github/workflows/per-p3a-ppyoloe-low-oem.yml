name: PER-P3A PPYOLOE official ONNX low OEM views (host-only)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/per-p3a-ppyoloe-low-oem.yml"
      - "experiments/per_p3a_rockchip_low_oem_visual.py"
      - "tests/test_per_p3a_rockchip_low_oem_visual.py"
      - "docs/per-p3a-ppyoloes-independent-oem-lowview-2026-10-30.md"
permissions:
  contents: read
jobs:
  frozen-low-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MUJOCO_GL: osmesa
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check OEM gitlinks unchanged
        run: |
          set -euo pipefail
          test "$(git -C upstream/microduck rev-parse HEAD)" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = "b02fdea4902c2b93b7d34a83a6f05da4ececb7d3"
      - uses: actions/checkout@v4
        with:
          repository: airockchip/rknn_model_zoo
          ref: 837db8e992815ff8647eadb709f07067f4bc3a71
          path: rknn_model_zoo
          sparse-checkout: |
            examples/ppyoloe
            py_utils
          persist-credentials: false
      - name: Verify pinned vendor sources
        run: |
          set -euo pipefail
          test "$(git -C rknn_model_zoo rev-parse HEAD)" = "837db8e992815ff8647eadb709f07067f4bc3a71"
          test -f rknn_model_zoo/examples/ppyoloe/python/ppyoloe.py
          test -f rknn_model_zoo/py_utils/coco_utils.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Isolate host-only Python dependencies and MuJoCo renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libgl1-mesa-dri
          python -m venv "$RUNNER_TEMP/p3a-venv"
          "$RUNNER_TEMP/p3a-venv/bin/python" -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'opencv-python-headless==4.9.0.80' \
            'onnxruntime==1.21.0' 'mujoco==3.3.7' 'Pillow==11.3.0' \
            'torch==2.3.1'
      - name: Positive and negative ABI / score gate tests before any model download
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src:$GITHUB_WORKSPACE/rknn_model_zoo"
          "$RUNNER_TEMP/p3a-venv/bin/python" -m unittest discover \
            -s tests -p test_per_p3a_rockchip_low_oem_visual.py -v
      - name: Download once with pinned host, SHA, size and redirect gate
        run: |
          set -euo pipefail
          export MODEL_PATH="$RUNNER_TEMP/ppyoloe_s.onnx"
          "$RUNNER_TEMP/p3a-venv/bin/python" - <<'PY'
          import hashlib, os
          from urllib.request import urlopen, Request
          from urllib.parse import urlsplit
          path=os.environ["MODEL_PATH"]
          url="https://ftrg.zbox.filez.com/v2/delivery/data/95f00b0fc900458ba134f8b180b3f7a1/examples/ppyoloe/ppyoloe_s.onnx"
          h=hashlib.sha256()
          total=0
          with urlopen(Request(url,headers={"User-Agent":"kwipi-P3A-readonly/1.0"}),timeout=45) as res:
              parsed=urlsplit(res.geturl())
              if parsed.scheme!="https" or parsed.hostname!="ftrg.zbox.filez.com":
                  raise SystemExit("Unapproved model redirect")
              with open(path,"xb") as f:
                  while chunk:=res.read(1024*1024):
                      total+=len(chunk)
                      if total>64*1024*1024:
                          raise SystemExit("model oversized")
                      h.update(chunk)
                      f.write(chunk)
          if total!=31734323 or h.hexdigest()!="af72d05b33723f6d18f9784f6bba8e593a5554f465f1800d7ad1ba1e33e38b8a":
              raise SystemExit("model byte/SHA mismatch")
          print("Exact P2B source model verified without publication")
          PY
      - name: One frozen low-view simulation/official ONNX inference study
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src:$GITHUB_WORKSPACE/rknn_model_zoo"
          "$RUNNER_TEMP/p3a-venv/bin/python" experiments/per_p3a_rockchip_low_oem_visual.py \
            --scene-dir upstream/microduck_rl/src/mjlab_microduck/robot/microduck \
            --vendor-root rknn_model_zoo \
            --model "$RUNNER_TEMP/ppyoloe_s.onnx" \
            --report "$RUNNER_TEMP/per-p3a-evidence.json" \
            --authorize-readonly-oem-simulation
      - name: Publish numeric evidence ONLY (no ONNX, RGB, geometry masks, RKNN)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-p3a-numeric-evidence-only
          path: ${{ runner.temp }}/per-p3a-evidence.json
          if-no-files-found: warn
          retention-days: 7
