name: R2-B+2 ABO chairs same-class multi-angle test (host only)
on:
  pull_request:
    paths:
      - microduck_companion/r2b_independent_capture_eval.py
      - microduck_companion/r2b2_abo_confusables.py
      - tests/test_r2b2_abo_confusables.py
      - .github/workflows/r2b2-abo-confusable.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abo-same-category:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify R2-B+2 contracts on artificial data first
        run: python -m unittest discover -s tests -p 'test_r2b2_abo_confusables.py' -v
      - name: Install optional host-only inference packages
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==1.26.4 onnxruntime==1.21.0
      - name: Download SHA-256-verified existing MobileNetV2 model into temporary runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 \
            --output "$RUNNER_TEMP/mobilenetv2-12.onnx" \
            "https://huggingface.co/onnxmodelzoo/mobilenetv2-12/resolve/main/mobilenetv2-12.onnx"
          echo "c0c3f76d93fa3fd6580652a45618618a220fced18babf65774ed169de0432ad5  $RUNNER_TEMP/mobilenetv2-12.onnx" | sha256sum --check
      - name: Evaluate CC BY 4.0 original CHAIR spin frames with distinct catalogue item IDs
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        shell: bash
        run: |
          # Attribution: Amazon.com / Guillaumin et al.; Amazon Berkeley Objects
          # CC BY 4.0 official https://amazon-berkeley-objects.s3.us-east-1.amazonaws.com/index.html
          # Same type CHAIR is a confusable-category PROXY, not independently
          # confirmed visually similar distinct manufactured objects.
          # All data/model files ephemeral, no media artifacts or private IDs.
          python -m microduck_companion.r2b2_abo_confusables \
            --locally-approved-ccby-research \
            --image-model "$RUNNER_TEMP/mobilenetv2-12.onnx"
