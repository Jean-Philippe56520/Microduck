# Opt-in integration experiment: run the OFFICIAL microduck MuJoCo daemons
# with the companion's read-only probe. No autonomy motor commands.
name: MuJoCo headless smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - ci/mujoco-headless-smoke-20261025
      - feat/sim-flat-zone-20261025
      - feat/one-bounded-sim-intent-20261025
      - feat/measured-sim-walk-learning-v1
      - feat/p0a-readonly-joint-trace-20261025
      - feat/p0b-stand-walk-comparison-20261025
      - feat/p0c-replay-contact-geometry-20261025
      - feat/p0d-live-solver-contact-tap-20261025
      - feat/p0e-actuator-gain-consistency-20261025
      - feat/p0f-policy-contract-audit-20261025
      - feat/p0g-compiled-contact-variants-20261025
      - feat/p0h-policy-slot-lineage-20261025
      - feat/p0i-controlled-policy-pair-20261025
      - feat/p2b-passive-mujoco-cycles-20261025
      - feat/x2c-mujoco-passive-acceptance-20261027
      - feat/sim-e1-active-experience-20261028
      - feat/sim-e2g-one-speed-onset-probe-20261028
      - feat/sim-visual-a1-20261029
    paths:
      - ".github/workflows/mujoco-smoke.yml"
      - "scripts/sim-smoke.sh"
      - "microduck_companion/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: mujoco-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DUCK_SIM_DEP_MODE: runtime
      PYTHONUNBUFFERED: "1"
      # Default remains no camera; only SIM-VIS-A1 opts into one simulated eye.
      DUCK_SIM_STATE: /tmp/duck-sim-companion
      # Visual opt-in sets MUJOCO_GL=osmesa; the default smoke remains blind.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "upstream/microduck_rl/uv.lock"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libasound2-dev python3-pil

      # The visual branch alone uses the OEM rendered camera. No V4L2/NPU.
      - name: SIM-VIS-A1 software rendering and pinned public model
        if: github.ref_name == 'feat/sim-visual-a1-20261029'
        run: |
          set -euo pipefail
          # Reuse the official OEM CI dependency set for mediad (Linux GStreamer).
          sudo apt-get install -y libosmesa6 libgl1-mesa-dri \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev
          uv python install 3.12
          # Public Apache-2.0 Cat-A YOLOX; fixed content digest and size.
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 90 \
            'https://huggingface.co/skillsafe-ai/yolox-nano/resolve/8e308810ede488f742901a4ac597dc7796798e46/yolox_nano.onnx' \
            --output "$RUNNER_TEMP/yolox-nano-a1.onnx"
          printf '%s  %s\\n' \
            'c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d' \
            "$RUNNER_TEMP/yolox-nano-a1.onnx" | sha256sum -c -
          # The actual headless vision probe uses the lean RL runtime Python.
          # Pillow and PyOpenGL are only required for this opt-in scene.
          # Installed after uv creates the runtime venv inside sim-smoke.sh.

      - name: Check pinned simulator sources and runtime
        run: |
          python3 -V
          cargo -V
          uv --version
          git submodule status
          uv python install 3.12
          sh -n scripts/sim-smoke.sh
          sh scripts/sim-smoke.sh check

      - name: Require Cat-A/Qwen fixture image tool on the host
        run: python3 -c 'from PIL import Image; print("Pillow", Image.__version__)'

      - name: Run companion unit tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q microduck_companion tests

      - name: Run pinned simulator safety gate and optional one-shot motion
        env:
          DUCK_SIM_SHORT_MOVE: ${{ github.ref_name == 'feat/one-bounded-sim-intent-20261025' && 'YES' || 'NO' }}
          DUCK_SIM_WALK_TRIAL: ${{ github.ref_name == 'feat/measured-sim-walk-learning-v1' && 'YES' || 'NO' }}
          DUCK_SIM_WALK_COMPARE: ${{ (github.ref_name == 'feat/p0b-stand-walk-comparison-20261025' || github.ref_name == 'feat/p0c-replay-contact-geometry-20261025' || github.ref_name == 'feat/p0d-live-solver-contact-tap-20261025' || github.ref_name == 'feat/p0e-actuator-gain-consistency-20261025') && 'YES' || 'NO' }}
          DUCK_SIM_SOLVER_TRACE: ${{ (github.ref_name == 'feat/p0d-live-solver-contact-tap-20261025' || github.ref_name == 'feat/p0e-actuator-gain-consistency-20261025') && 'YES' || 'NO' }}
          DUCK_SIM_ACTUATOR_AUDIT: ${{ github.ref_name == 'feat/p0e-actuator-gain-consistency-20261025' && 'YES' || 'NO' }}
          DUCK_SIM_CONTACT_REPLAY: ${{ github.ref_name == 'feat/p0c-replay-contact-geometry-20261025' && 'YES' || 'NO' }}
          DUCK_SIM_POLICY_AUDIT: ${{ github.ref_name == 'feat/p0f-policy-contract-audit-20261025' && 'YES' || 'NO' }}
          DUCK_SIM_POLICY_LINEAGE: ${{ github.ref_name == 'feat/p0h-policy-slot-lineage-20261025' && 'YES' || 'NO' }}
          DUCK_SIM_POLICY_PAIR: ${{ github.ref_name == 'feat/p0i-controlled-policy-pair-20261025' && 'YES' || 'NO' }}
          DUCK_SIM_GEOMETRY_COMPARE: ${{ github.ref_name == 'feat/p0g-compiled-contact-variants-20261025' && 'YES' || 'NO' }}
          DUCK_SIM_PASSIVE_CYCLES: ${{ github.ref_name == 'feat/p2b-passive-mujoco-cycles-20261025' && 'YES' || 'NO' }}
          # This branch alone runs the two X2-C read-only simulator sessions.
          DUCK_SIM_X2C_ACCEPTANCE: ${{ github.ref_name == 'feat/x2c-mujoco-passive-acceptance-20261027' && 'YES' || 'NO' }}
          DUCK_SIM_SIM_E1: ${{ github.ref_name == 'feat/sim-e1-active-experience-20261028' && 'YES' || 'NO' }}
          # SIM-E2G: ONE pinned OEM alpha run at 0.30m/s, never user/robot mode.
          DUCK_SIM_VX_ONSET: ${{ github.ref_name == 'feat/sim-e2g-one-speed-onset-probe-20261028' && 'YES' || 'NO' }}
          # No automatic E2H motor run: original contacts are archived and rechecked offline.
          DUCK_SIM_VIS_A1: ${{ github.ref_name == 'feat/sim-visual-a1-20261029' && 'YES' || 'NO' }}
          DUCK_SIM_VIS_MODEL: ${{ runner.temp }}/yolox-nano-a1.onnx
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 18m             sh scripts/sim-smoke.sh run 2>&1 | tee "${{ runner.temp }}/mujoco-smoke-console.log"

      - name: Stop any remaining simulated services
        if: always()
        run: |
          if [ -x upstream/microduck/scripts/duck-sim ]; then
            DUCK_SIM_RL="$GITHUB_WORKSPACE/upstream/microduck_rl"               DUCK_SIM_STATE="/tmp/duck-sim-companion"               DUCK_SIM_PORT=17801               upstream/microduck/scripts/duck-sim down || true
          fi

      - name: Archive diagnostics, even if startup fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mujoco-headless-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/mujoco-smoke-console.log
            /tmp/duck-sim-companion/*.log
            /tmp/duck-sim-companion/joint-trace.json
            /tmp/duck-sim-companion/walk-comparison.json
            /tmp/duck-sim-companion/contact-replay.json
            /tmp/duck-sim-companion/solver-tap.jsonl
            /tmp/duck-sim-companion/solver-analysis.json
            /tmp/duck-sim-companion/actuator-gain-audit.json
            /tmp/duck-sim-companion/policy-contract.json
            /tmp/duck-sim-companion/policy-lineage.json
            /tmp/duck-sim-companion/p0i-alpha.json
            /tmp/duck-sim-companion/p0i-velstand.json
            /tmp/duck-sim-companion/p0i-comparison.json
            /tmp/duck-sim-companion/compiled-geometry-variants.json
            /tmp/duck-sim-companion/p2b-passive-session-a.json
            /tmp/duck-sim-companion/p2b-passive-session-b.json
            /tmp/duck-sim-companion/x2c-passive-session-a.json
            /tmp/duck-sim-companion/x2c-passive-session-b.json
            /tmp/duck-sim-companion/x2c-acceptance.json
            /tmp/duck-sim-companion/sim-e1-report.json
            /tmp/duck-sim-companion/sim-e2g-report.json
            /tmp/duck-sim-companion/sim-e2h-contact-report.json
            /tmp/duck-sim-companion/sim-visual-a1.json
