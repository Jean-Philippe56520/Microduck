name: M1-B optional public Commons CC0 host spot check
on:
  push:
    branches:
      - feat/m1b-multiview-capacity-and-evaluation-20261026
    paths:
      - microduck_companion/m1b_public_media_eval.py
      - tests/test_m1b_public_media_eval.py
      - .github/workflows/m1b-cc0-media-study.yml
  workflow_dispatch:
jobs:
  public-media:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host-only public image decoder
        run: python -m pip install pillow==11.3.0
      - name: Verify host-only OGG decoding
        run: ffmpeg -version | head -n 1
      - name: Evaluate independent curated CC0 photos and two CC0 sound files
        run: |
          # HTTPS to curated Wikimedia Commons ONLY. Media stays in memory.
          # No faces/voices/private data, robotd, Ollama, NPU or motors.
          python -m microduck_companion.m1b_public_media_eval --public-cc0
