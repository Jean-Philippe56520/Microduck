name: PER-QUAL-1B YOLOX 42 novel COCO JPEGs paired against frozen COCO and Sama GT
on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/per_qual1b_yolox_paired42.py"
      - "tests/test_per_qual1b_yolox_paired42.py"
      - ".github/workflows/per-qual1b-yolox-paired42.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-public-yolox-host:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify pinned OEM sources untouched
        shell: bash
        run: |
          set -euo pipefail
          git ls-tree HEAD upstream/microduck | grep -F '942e58e3aa6dbb28e7037203fff11866122c7567'
          git ls-tree HEAD upstream/microduck_rl | grep -F 'b02fdea4902c2b93b7d34a83a6f05da4ececb7d3'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install already used pinned host-only CPU dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==1.26.4 onnxruntime==1.21.0
      - name: Run positive and negative offline host fixtures before network
        run: |
          python -m compileall -q experiments/per_qual1b_yolox_paired42.py tests/test_per_qual1b_yolox_paired42.py
          python -m unittest discover -s tests -p 'test_per_qual1b_yolox_paired42.py' -v
          python -m unittest discover -s tests -p 'test_per_qual1_sama_gt_gate.py' -v
      - name: Retrieve only two already frozen public annotation files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 --max-filesize 35000000 \
            --output "$RUNNER_TEMP/instances_val2017.json" \
            'https://huggingface.co/datasets/LibreYOLO/coco2017/resolve/main/instances_val2017.json'
          echo "e8c7f7908f1d7278341fae127d0da654f102f11bd7b21d8aeefa635b8c810b6f  $RUNNER_TEMP/instances_val2017.json" | sha256sum --check
          curl --fail --location --retry 2 --max-time 180 --max-filesize 20000000 \
            --output "$RUNNER_TEMP/sama-coco-val.zip" \
            'https://sama-documentation-assets.s3.amazonaws.com/sama-coco/sama-coco-val.zip'
          echo "c55454f6657ce63891783136cc5dfe5f1e9c5e1748c0d8ca08b456a804eab15f  $RUNNER_TEMP/sama-coco-val.zip" | sha256sum --check
      - name: Gate identical 42 source-selected IDs BEFORE model or JPEG access
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s python -m experiments.per_qual1b_yolox_paired42 --approved-public-media \
            --validate-only --annotations "$RUNNER_TEMP/instances_val2017.json" \
            --sama-zip "$RUNNER_TEMP/sama-coco-val.zip" > "$RUNNER_TEMP/perqual1b-source-only.json"
          python - "$RUNNER_TEMP/perqual1b-source-only.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as fp: r=json.load(fp)
          assert r["status"]=="SOURCE_GATE_PASS_NO_INFERENCE"
          assert r["selected_photos"]==42 and r["assigned_per_category"]==6
          assert r["prior_coco_images_excluded"]==1232
          assert r["cohort_sha256"]=="709718feba6185ddd79e2aa492c7eaf74bb2d904dfa6c30e81a25c31dbdb53d5"
          assert r["source_sha256"]=="c55454f6657ce63891783136cc5dfe5f1e9c5e1748c0d8ca08b456a804eab15f"
          assert r["viewpoint_height"]=="unknown"
          assert r["inferences_executed"]==r["image_fetches"]==r["motor_commands"]==r["sqlite_writes"]==r["qwen_calls"]==0
          assert not r["promotion"] and not r["robot_rknn_validated"]
          print("PER_QUAL1B_SOURCE_GATE: PASS_NO_INFERENCE")
          PY
      - name: Fetch identical approved YOLOX Nano ONNX only after full source gate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 --max-filesize 4500000 \
            --output "$RUNNER_TEMP/yolox_nano.onnx" \
            'https://huggingface.co/skillsafe-ai/yolox-nano/resolve/8e308810ede488f742901a4ac597dc7796798e46/yolox_nano.onnx'
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  $RUNNER_TEMP/yolox_nano.onnx" | sha256sum --check
      - name: Infer each of exactly 42 frozen new COCO images ONCE against two GTs
        shell: bash
        run: |
          set -euo pipefail
          timeout 1150s python -m experiments.per_qual1b_yolox_paired42 --approved-public-media \
            --annotations "$RUNNER_TEMP/instances_val2017.json" \
            --sama-zip "$RUNNER_TEMP/sama-coco-val.zip" \
            --model "$RUNNER_TEMP/yolox_nano.onnx" \
            > "$RUNNER_TEMP/perqual1b-numeric.json"
          python - "$RUNNER_TEMP/perqual1b-numeric.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as fp: r=json.load(fp)
          assert r["status"]=="HOST_PAIRED_GT_SENSITIVITY_MEASURED"
          assert r["decision"]=="STOP_PROMOTION"
          assert r["selected_photos"]==r["inferences_executed"]==r["image_fetches"]==42
          assert r["prior_coco_images_excluded"]==1232
          assert len(r["classwise_scores"])==7
          assert all(x["allocated_photos"]==6 and x["evaluated_photos"]==42 for x in r["classwise_scores"].values())
          assert all(x["matched_coco_iou50"]<=x["gt_coco_boxes"] and x["matched_sama_iou50"]<=x["gt_sama_boxes"] for x in r["classwise_scores"].values())
          assert not r["promotion"] and not r["robot_rknn_validated"] and r["viewpoint_height"]=="unknown"
          assert r["motor_commands"]==r["sqlite_writes"]==r["qwen_calls"]==0
          print(json.dumps(r,sort_keys=True))
          PY
          cp "$RUNNER_TEMP/perqual1b-numeric.json" perqual1b-numeric-only.json
      - name: Publish numerical aggregations only, no photos, image IDs or model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: per-qual1b-coco-sama-paired-numeric-only
          path: perqual1b-numeric-only.json
          if-no-files-found: error
          retention-days: 14
