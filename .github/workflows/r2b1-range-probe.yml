name: R2-B+1 DCASE ToyADMOS real sound pilot (no media artifacts)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  real_audio_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate ten original real machine recordings with strict Zenodo byte ranges
        shell: bash
        run: |
          python -m microduck_companion.r2b1_zenodo_ranges \
            --reviewed-cc-by-nc-sa-noncommercial \
            --reviewed-original-operation-provenance
