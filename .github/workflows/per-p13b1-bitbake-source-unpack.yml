name: PER-P13B1 real BitBake fetch and unpack (NOT compiled/image)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/per-p13b1-bitbake-source-unpack.yml"
      - "scripts/per_p13b1_unpacked_source_gate.py"
      - "tests/test_per_p13b1_unpacked_source_gate.py"
      - "docs/per-p13b1-bitbake-source-unpack-2026-10-30.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-real-bitbake-fetch-unpack:
    runs-on: ubuntu-22.04
    timeout-minutes: 48
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      P13_YOCTO: /tmp/p13b1-yocto
      P13_SOURCE: /tmp/p13b1-source
      P13_LAYER: /tmp/p13b1-meta-kwipi
      KAS_WORK_DIR: /tmp/p13b1-kas-work
      KAS_BUILD_DIR: /tmp/p13b1-kas-build
      KAS_CLONE_DEPTH: "1"
      P13_ENV: /tmp/p13b1-effective-bitbake-env.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Verify immutable main OEM pins and negative/positive tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C upstream/microduck rev-parse HEAD)" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = "b02fdea4902c2b93b7d34a83a6f05da4ececb7d3"
          python -m compileall -q scripts/per_p13b1_unpacked_source_gate.py tests/test_per_p13b1_unpacked_source_gate.py
          python -m unittest discover -s tests -p 'test_per_p13b1_unpacked_source_gate.py' -v
          python -m unittest discover -s tests -p 'test_per_p13a_bitbake_env_gate.py' -v
          git diff --exit-code -- upstream/
      - name: Verify exact Yocto source checkout in scratch
        run: |
          set -euo pipefail
          mkdir -p "$P13_YOCTO"
          git -C "$P13_YOCTO" init -q
          git -C "$P13_YOCTO" remote add origin https://github.com/pollen-robotics/microduck_yocto.git
          GIT_TERMINAL_PROMPT=0 git -C "$P13_YOCTO" fetch --depth 1 origin 1ee58387810cebb67ae0d634c351d95024483bce
          git -C "$P13_YOCTO" checkout --detach FETCH_HEAD
          test "$(git -C "$P13_YOCTO" rev-parse HEAD)" = "1ee58387810cebb67ae0d634c351d95024483bce"
      - name: Reuse P11/P12 exact source archive and guarded layer generator
        run: |
          set -euo pipefail
          python -m scripts.per_p11_v1_source_release --oem-checkout upstream/microduck --output-dir "$P13_SOURCE"
          (cd "$P13_SOURCE" && sha256sum -c kwipi-v1-oem-source.tar.gz.sha256)
          python -m scripts.per_p12_yocto_layer stage \
            --yocto "$P13_YOCTO" --source-dir "$P13_SOURCE" --output "$P13_LAYER"
          python -m scripts.per_p12_yocto_layer verify --layer "$P13_LAYER"
          git diff --exit-code -- upstream/
      - name: Install minimal pinned BitBake host dependencies without changing security policy
        run: |
          set -euo pipefail
          available="$(df -Pk /tmp | awk 'NR==2 {print $4}')"
          echo "Free disk before bitbake metadata/source fetch: $available KB"
          test "$available" -ge 6000000 || { echo "P13B1 STOP: less than 6GB for fetch/unpack"; exit 1; }
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends chrpath diffstat
          command -v chrpath
          command -v diffstat
          mkdir -p "$KAS_WORK_DIR" "$KAS_BUILD_DIR"
          python -m venv "$RUNNER_TEMP/p13b1-kas-venv"
          "$RUNNER_TEMP/p13b1-kas-venv/bin/pip" install --disable-pip-version-check --no-cache-dir "kas==5.2.0"
          "$RUNNER_TEMP/p13b1-kas-venv/bin/kas" --version
          echo "$RUNNER_TEMP/p13b1-kas-venv/bin" >> "$GITHUB_PATH"
      - name: Compose local-only Yocto layer without changing OEM source
        run: |
          set -euo pipefail
          cat > "$P13_YOCTO/kas/per-p13b1-layer.yml" <<EOF
          header:
            version: 14
          repos:
            kwipi:
              path: $P13_LAYER
              layers:
                .:
          EOF
          test "$(git -C "$P13_YOCTO" status --porcelain --untracked-files=no)" = ""
      - name: Run real BitBake fetch and unpack on pinned sources (no compile or image)
        run: |
          set -euo pipefail
          config="$P13_YOCTO/kas/microduck.yml:$P13_YOCTO/kas/per-p13b1-layer.yml"
          timeout 2000s kas shell "$config" -c \
            "bitbake -c fetch microduck-daemon && bitbake -c unpack microduck-daemon && bitbake -e microduck-daemon > $P13_ENV"
          test -s "$P13_ENV"
          echo "BitBake do_fetch and do_unpack returned successfully. No do_compile invoked."
      - name: Verify real unpacked file bytes, source path, and pinned BMI088
        run: |
          set -euo pipefail
          python -m scripts.per_p13b1_unpacked_source_gate \
            --env-file "$P13_ENV" \
            --p12-layer "$P13_LAYER" \
            --build-dir "$KAS_BUILD_DIR" \
            --output "$RUNNER_TEMP/p13b1-result.json"
          python - <<'PY'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "p13b1-result.json").read_text())
          assert r["status"]=="bitbake_unpacked_source_verified"
          assert r["source_members_verified"] == 6
          assert r["registry_crates_metadata"] == 568
          assert not any(r[k] for k in ("bitbake_compile_run", "bitbake_package_run",
                  "signed_release", "rauc_built", "python_companion_installed", "robot_tested"))
          print("P13B1 real BitBake source unpack verified: no target binary or robot claims")
          PY
          test "$(git -C "$P13_YOCTO" status --porcelain --untracked-files=no)" = ""
          git diff --exit-code -- upstream/
      - name: Retain only bounded source unpack proof, not source archives or the environment
        uses: actions/upload-artifact@v4
        with:
          name: kwipi-p13b1-real-bitbake-unpack-proof-only
          path: ${{ runner.temp }}/p13b1-result.json
          retention-days: 7
