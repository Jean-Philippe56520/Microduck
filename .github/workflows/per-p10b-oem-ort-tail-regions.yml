name: PER-P10B real OEM ORT tail to Rust P7 P9

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/per-p10b-oem-ort-tail-regions.yml"
      - "scripts/per_p10b_apply_oem_tail_overlay.py"
      - "scripts/per_p10b_seg_tail.rs"
      - "scripts/per_p10b_synthetic_onnx.py"
      - "tests/test_per_p10b_overlay.py"
      - "docs/per-p10b-ort-tail-p7p9-prereg-2026-10-30.md"
      - "rust/kwipi-seg-mask-core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ort-synthetic-p10a-p7-p9:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTFLAGS: "-D warnings"
      PYTHONDONTWRITEBYTECODE: "1"
      P10B_OEM: /tmp/p10b-oem-pinned
      KWIPI_P10B_TEST_MODELS: /tmp/p10b-models
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify exact source pins and no model or motor changes
        run: |
          set -euo pipefail
          test "$(git -C upstream/microduck rev-parse HEAD)" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = "b02fdea4902c2b93b7d34a83a6f05da4ececb7d3"
          test "$(git -C upstream/microduck hash-object duck-detect/src/onnx.rs)" = "bc8881ac3fefacd4ab149926e40cad535db4fa22"
          test "$(git -C upstream/microduck hash-object duck-detect/src/lib.rs)" = "74ce1267322876e8394e736d3b13988ad358ea61"
          test ! -e tail.onnx
          test ! -e model.rknn
          git diff --exit-code -- upstream/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test source refusal and generate six synthetic ONNX fixture models
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_per_p10a_overlay.py' -v
          python -m unittest discover -s tests -p 'test_per_p10b_overlay.py' -v
          python -m pip install --disable-pip-version-check "onnx==1.16.2" "numpy==1.26.4"
          python scripts/per_p10b_synthetic_onnx.py --output-dir "$KWIPI_P10B_TEST_MODELS"
          test "$(find "$KWIPI_P10B_TEST_MODELS" -name '*.onnx' -type f | wc -l)" -eq 6

      - name: Assemble P10A then P10B in a temporary pinned OEM git archive
        run: |
          set -euo pipefail
          mkdir -p "$P10B_OEM"
          git -C upstream/microduck archive 942e58e3aa6dbb28e7037203fff11866122c7567 | tar -x -C "$P10B_OEM"
          printf '%s\n' '942e58e3aa6dbb28e7037203fff11866122c7567' > "$P10B_OEM/.per-p10a-throwaway-pin"
          python scripts/per_p10a_apply_oem_rknn_overlay.py --archive "$P10B_OEM"
          python -m scripts.per_p10b_apply_oem_tail_overlay --archive "$P10B_OEM"
          test -f "$P10B_OEM/duck-detect/src/seg_tail.rs"
          git diff --exit-code -- upstream/

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
          targets: aarch64-unknown-linux-gnu

      - name: Check authored Rust format and update only temporary OEM Cargo.lock
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check scripts/per_p10b_seg_tail.rs
          cargo metadata --manifest-path "$P10B_OEM/Cargo.toml" --format-version 1 > /dev/null
          cargo fmt --manifest-path "$P10B_OEM/Cargo.toml" -p duck-detect -- --check

      - name: Download hash-verified official ONNX Runtime 1.28 x64 for CI only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ort-v1.28"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 "https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-x64-1.28.0.tgz" -o "$RUNNER_TEMP/ort-v1.28.tgz"
          echo "a3e1b79d7bb1bf09696ce675f49e4064e6c81f6202b8225624fff0e93f8d6407  $RUNNER_TEMP/ort-v1.28.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ort-v1.28.tgz" -C "$RUNNER_TEMP/ort-v1.28"
          lib="$(find "$RUNNER_TEMP/ort-v1.28" -name 'libonnxruntime.so.1.28.0' -type f -print -quit)"
          test -n "$lib"
          echo "ORT_DYLIB_PATH=$lib" >> "$GITHUB_ENV"

      - name: Execute real OEM Rust ort session plus P7 mask and P9 regions
        run: |
          set -euo pipefail
          cargo test --manifest-path "$P10B_OEM/Cargo.toml" --locked -p duck-detect --lib -- --nocapture
          cargo clippy --manifest-path "$P10B_OEM/Cargo.toml" --locked -p duck-detect --lib --all-targets -- -D warnings

      - name: Check ARM64 compilation of same source without executing on robot
        run: |
          set -euo pipefail
          cargo check --manifest-path "$P10B_OEM/Cargo.toml" --locked -p duck-detect --lib --target aarch64-unknown-linux-gnu
          echo "Host ORT x64 and ARM64 compilation only: not RK3566 NPU, mediad, Yocto image or robot."

      - name: Confirm pinned sources, no photographs or model redistribution
        run: |
          set -euo pipefail
          git diff --exit-code -- upstream/
          test "$(git -C upstream/microduck rev-parse HEAD)" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test ! -e tail.onnx && test ! -e model.rknn
