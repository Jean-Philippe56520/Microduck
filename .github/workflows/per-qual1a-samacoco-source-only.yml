name: PER-QUAL-1A Sama-COCO correlated-human-annotations preflight (NO inference)
on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/per_qual1_sama_gt_gate.py"
      - "tests/test_per_qual1_sama_gt_gate.py"
      - ".github/workflows/per-qual1a-samacoco-source-only.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-public-gt-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify OEM and RL gitlinks unchanged
        shell: bash
        run: |
          set -euo pipefail
          git ls-tree HEAD upstream/microduck | grep -F '942e58e3aa6dbb28e7037203fff11866122c7567'
          git ls-tree HEAD upstream/microduck_rl | grep -F 'b02fdea4902c2b93b7d34a83a6f05da4ececb7d3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Positive/negative offline tests and syntax
        run: |
          python -m compileall -q experiments/per_qual1_sama_gt_gate.py tests/test_per_qual1_sama_gt_gate.py
          python -m unittest discover -s tests -p 'test_per_qual1_sama_gt_gate.py' -v
      - name: Download bounded public original COCO GT and check fixed SHA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 --max-filesize 35000000 \
            --output "$RUNNER_TEMP/instances_val2017.json" \
            'https://huggingface.co/datasets/LibreYOLO/coco2017/resolve/main/instances_val2017.json'
          echo "e8c7f7908f1d7278341fae127d0da654f102f11bd7b21d8aeefa635b8c810b6f  $RUNNER_TEMP/instances_val2017.json" | sha256sum --check
      - name: Download small original Sama-COCO validation label archive, NO photos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 --max-filesize 20000000 \
            --output "$RUNNER_TEMP/sama-coco-val.zip" \
            'https://sama-documentation-assets.s3.amazonaws.com/sama-coco/sama-coco-val.zip'
      - name: Select 42 disjoint sources and record hashes before ANY model access
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s python -m experiments.per_qual1_sama_gt_gate \
            --approved-public-metadata \
            --annotations "$RUNNER_TEMP/instances_val2017.json" \
            --sama-zip "$RUNNER_TEMP/sama-coco-val.zip" \
            > "$RUNNER_TEMP/perqual1a-source-only.json"
          python - "$RUNNER_TEMP/perqual1a-source-only.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as fp:
              d=json.load(fp)
          assert d['status']=='SOURCE_GATE_PASS_NO_INFERENCE'
          assert d['excluded_previous_coco_val_images']==1232
          assert d['prospective_new_photos_selected']==42
          assert d['per_target_allocation']==6
          assert len(d['categories'])==7
          assert all(row['allocated_photos']==6 for row in d['paired_annotations'].values())
          assert d['gt_processes_independent_of_yolox_predictions']
          assert not d['gt_processes_statistically_independent']
          assert d['images_fetched']==d['inferences_executed']==d['motor_commands']==d['qwen_calls']==d['sqlite_writes']==0
          assert not d['model_accessed'] and not d['promotion']
          assert d['viewpoint_height']=='unknown'
          print('PER_QUAL1A_SOURCE_ONLY_GATE: PASS')
          print(json.dumps({'source_sha256':d['sama_zip_sha256'], 'roster_sha256':d['cohort_selection_sha256'], 'paired_annotations':d['paired_annotations']},sort_keys=True))
          PY
          cp "$RUNNER_TEMP/perqual1a-source-only.json" perqual1a-source-only.json
      - name: Upload numerical provenance ONLY, no JPEG, no model, no IDs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: per-qual1a-samacoco-source-only
          path: perqual1a-source-only.json
          retention-days: 14
          if-no-files-found: error
