name: PER-P10B OEM ORT tail to Rust P7/P9

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/per-p10b-oem-ort-tail.yml"
      - "scripts/per_p10b_*"
      - "docs/per-p10b-ort-tail-p7p9-prereg-2026-10-30.md"
      - "rust/kwipi-seg-mask-core/**"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  oem-tail-rust-real-ort:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check pins and no redistribution
        run: |
          set -euo pipefail
          test "$(git -C upstream/microduck rev-parse HEAD)" = "942e58e3aa6dbb28e7037203fff11866122c7567"
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = "b02fdea4902c2b93b7d34a83a6f05da4ececb7d3"
          test ! -f tail.onnx
          git diff --exit-code -- upstream/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install synthetic ONNX fixture authoring only
        run: |
          python -m pip install --disable-pip-version-check "numpy==1.26.4" "onnx==1.16.2"
      - name: Generate non-redistributed ten-input fixture
        run: |
          python scripts/per_p10b_make_fixture.py --out "$RUNNER_TEMP/per-p10b-fixture.onnx"
      - name: Prepare source-only OEM archive with P10A and P10B
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/per-p10b-oem"
          mkdir -p "$root"
          git -C upstream/microduck archive 942e58e3aa6dbb28e7037203fff11866122c7567 | tar -x -C "$root"
          printf '%s\n' '942e58e3aa6dbb28e7037203fff11866122c7567' > "$root/.per-p10a-throwaway-pin"
          python scripts/per_p10a_apply_oem_rknn_overlay.py --archive "$root"
          python scripts/per_p10b_apply_oem_ort_overlay.py --archive "$root" --core rust/kwipi-seg-mask-core
          git diff --exit-code -- upstream/
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
          targets: aarch64-unknown-linux-gnu
      - name: Download verified official ONNX Runtime x64, no files committed
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/ort.tgz" https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-x64-1.28.0.tgz
          echo "a3e1b79d7bb1bf09696ce675f49e4064e6c81f6202b8225624fff0e93f8d6407  $RUNNER_TEMP/ort.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ort"
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP/ort"
          lib="$(find "$RUNNER_TEMP/ort" -name 'libonnxruntime.so*' -type f | head -1)"
          test -n "$lib"
          echo "ORT_DYLIB_PATH=$lib" >> "$GITHUB_ENV"
      - name: Run real Rust OEM ORT fixture and all duck-detect regressions
        env:
          KWIPI_PER_P10B_ONNX: ${{ runner.temp }}/per-p10b-fixture.onnx
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/per-p10b-oem"
          cargo fmt --manifest-path "$root/Cargo.toml" -p duck-detect
          cargo test --manifest-path "$root/Cargo.toml" -p duck-detect --lib
          cargo clippy --manifest-path "$root/Cargo.toml" -p duck-detect --all-targets -- -D warnings
          cargo check --manifest-path "$root/Cargo.toml" -p duck-detect --lib --target aarch64-unknown-linux-gnu
          git diff --exit-code -- upstream/
          echo "ORT x64 real fixture test only; no RK3566, mediad, robot, real weight."
