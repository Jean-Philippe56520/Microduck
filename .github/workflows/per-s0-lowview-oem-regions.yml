name: PER-S0 OEM low-view unknown region vs five labels (PC only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/per-s0-lowview-oem-regions.yml"
      - "experiments/per_s0_lowview_oem_region.py"
      - "tests/test_per_s0_lowview_oem_region.py"
      - "docs/per-s0-lowview-unknown-regions-2026-10-30.md"

permissions:
  contents: read

jobs:
  frozen-oem-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MUJOCO_GL: osmesa
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Confirm pinned OEM code/simulation and no private media
        run: |
          set -euo pipefail
          test "$(git -C upstream/microduck rev-parse HEAD)" = '942e58e3aa6dbb28e7037203fff11866122c7567'
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = 'b02fdea4902c2b93b7d34a83a6f05da4ececb7d3'
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene.xml
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene_apartment.xml
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene_vslam.xml
          test ! -e kwipi_photos_privees_tests_2026-10-30.zip

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "upstream/microduck_rl/uv.lock"

      - name: Isolated official OEM MuJoCo renderer and existing ONNX runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libgl1-mesa-dri
          uv python install 3.12
          uv venv --python 3.12 "$RUNNER_TEMP/per-s0-venv"
          uv pip install --python "$RUNNER_TEMP/per-s0-venv/bin/python" \
            'mujoco==3.10.0' 'numpy==2.5.4' 'onnxruntime==1.28.0' \
            'Pillow==11.3.0' 'PyOpenGL==3.1.10'

      - name: Positive and negative GT, decision gate and fail-closed tests
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          "$RUNNER_TEMP/per-s0-venv/bin/python" -m unittest discover \
            -s tests -p test_per_s0_lowview_oem_region.py -v
          "$RUNNER_TEMP/per-s0-venv/bin/python" -m compileall -q \
            experiments/per_s0_lowview_oem_region.py \
            tests/test_per_s0_lowview_oem_region.py

      - name: Independent OEM geometry preflight BEFORE any model download
        id: preflight
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          "$RUNNER_TEMP/per-s0-venv/bin/python" \
            -m experiments.per_s0_lowview_oem_region \
            --scene-dir upstream/microduck_rl/src/mjlab_microduck/robot/microduck \
            --preflight-only \
            --output "$RUNNER_TEMP/per-s0-preflight.json" \
            --authorize-static-oem-render
          valid=$("$RUNNER_TEMP/per-s0-venv/bin/python" -c \
            'import json,sys; print("true" if json.load(open(sys.argv[1]))["preflight_geometry_valid"] else "false")' \
            "$RUNNER_TEMP/per-s0-preflight.json")
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          if [ "$valid" != "true" ]; then
            echo 'STOP: geometry invalid; no model downloaded or inferred'
          fi

      - name: Fetch exact existing Megvii YOLOX model (public model only)
        if: steps.preflight.outputs.valid == 'true'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 90 \
            'https://huggingface.co/skillsafe-ai/yolox-nano/resolve/8e308810ede488f742901a4ac597dc7796798e46/yolox_nano.onnx' \
            --output "$RUNNER_TEMP/per-s0-yolox.onnx"
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  $RUNNER_TEMP/per-s0-yolox.onnx" | sha256sum -c -

      - name: One fixed independent five-positive and one-negative model pass
        if: steps.preflight.outputs.valid == 'true'
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          "$RUNNER_TEMP/per-s0-venv/bin/python" \
            -m experiments.per_s0_lowview_oem_region \
            --scene-dir upstream/microduck_rl/src/mjlab_microduck/robot/microduck \
            --model "$RUNNER_TEMP/per-s0-yolox.onnx" \
            --output "$RUNNER_TEMP/per-s0-numeric.json" \
            --authorize-static-oem-render

      - name: Publish only numeric OEM geometry and detections (no images/weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-s0-oem-geometry-and-onnx-numeric-only
          path: |
            ${{ runner.temp }}/per-s0-preflight.json
            ${{ runner.temp }}/per-s0-numeric.json
          if-no-files-found: warn
          retention-days: 7
