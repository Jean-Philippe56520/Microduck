name: R2-B real ABO CC-BY turntable views, host only
on:
  pull_request:
    paths:
      - microduck_companion/r2b_independent_capture_eval.py
      - tests/test_r2b_independent_capture_eval.py
      - .github/workflows/r2b-abo-multiview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abo-turntable-public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify R2-B offline contracts first
        run: python -m unittest discover -s tests -p 'test_r2b_independent_capture_eval.py' -v
      - name: Install host-only image/ONNX CPU tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==1.26.4 onnxruntime==1.21.0
      - name: Test the optional local PNG manifest adapter with synthetic pixels
        run: python -m unittest discover -s tests -p 'test_r2b_independent_capture_eval.py' -v
      - name: Obtain SHA-pinned M1-B2 vision model into temporary runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 90 \
            --output "$RUNNER_TEMP/mobilenetv2-12.onnx" \
            "https://huggingface.co/onnxmodelzoo/mobilenetv2-12/resolve/main/mobilenetv2-12.onnx"
          echo "c0c3f76d93fa3fd6580652a45618618a220fced18babf65774ed169de0432ad5  $RUNNER_TEMP/mobilenetv2-12.onnx" | sha256sum --check
      - name: Compare REAL independently rotated frames of public CC BY 4.0 ABO spins
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          # Amazon.com/Guillaumin et al. Amazon Berkeley Objects (ABO),
          # CC BY 4.0: https://amazon-berkeley-objects.s3.amazonaws.com/index.html
          # 12 distinct labelled spin sequences, 6 original frame angles per
          # sequence. Same turntable session; NOT new photographic sessions.
          # No images uploaded to GitHub/artifacts; network, weights and media
          # only exist in this ephemeral job. No private identity or motor.
          python -m microduck_companion.r2b_independent_capture_eval \
            --locally-approved-research --public-abo-ccby \
            --image-model "$RUNNER_TEMP/mobilenetv2-12.onnx"
