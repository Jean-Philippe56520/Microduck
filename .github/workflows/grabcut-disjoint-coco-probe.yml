name: Kwipi GrabCut fourth disjoint COCO polygons (host experiment)
on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/grabcut_*.py"
      - ".github/workflows/grabcut-disjoint-coco-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grabcut-host:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use existing CPU YOLOX and OpenCV host-only library
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==1.26.4 onnxruntime==1.21.0 opencv-python-headless==4.10.0.84
      - name: Run synthetic shape and colour positives plus blank-scene/invalid geometry negatives
        run: python -m unittest experiments.test_grabcut_region_probe -v
      - name: Download exact pinned validation COCO polygons and unmodified YOLOX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 \
            --output "$RUNNER_TEMP/instances_val2017.json" \
            "https://huggingface.co/datasets/LibreYOLO/coco2017/resolve/main/instances_val2017.json"
          echo "e8c7f7908f1d7278341fae127d0da654f102f11bd7b21d8aeefa635b8c810b6f  $RUNNER_TEMP/instances_val2017.json" | sha256sum --check
          curl --fail --location --retry 2 --max-time 120 \
            --output "$RUNNER_TEMP/yolox_nano.onnx" \
            "https://huggingface.co/skillsafe-ai/yolox-nano/resolve/8e308810ede488f742901a4ac597dc7796798e46/yolox_nano.onnx"
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  $RUNNER_TEMP/yolox_nano.onnx" | sha256sum --check
      - name: Evaluate fourth COCO cohort with independent polygon masks
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          COCO_VAL_ANNOTATIONS: ${{ runner.temp }}/instances_val2017.json
          YOLOX_MODEL: ${{ runner.temp }}/yolox_nano.onnx
          GRABCUT_RESULT: ${{ runner.temp }}/kwipi-grabcut-result.json
        run: python -m experiments.grabcut_coco_disjoint_probe
      - name: Save numerical report only, never photographs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwipi-grabcut-coco-fourth-disjoint-host-json
          path: ${{ runner.temp }}/kwipi-grabcut-result.json
          if-no-files-found: warn
