name: Cat-A2b public 12cm unlabelled proposal probe (host only)
on:
  pull_request:
    branches: [main]
    paths:
      - "microduck_companion/cata2b_public_low_probe.py"
      - "tests/test_cata2b_public_low_probe.py"
      - ".github/workflows/cata2b-public-12cm-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low-public-research-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Existing CPU Cat-A dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==1.26.4 onnxruntime==1.21.0
      - name: Synthetic fixtures for source hashes, geometry, gates and unknown GT
        run: |
          python -m unittest discover -s tests -p 'test_cata2b_public_low_probe.py' -v
          python -m compileall -q microduck_companion/cata2b_public_low_probe.py
      - name: Fetch EXACT approved Apache-2.0 YOLOX weights by digest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 \
            --output "$RUNNER_TEMP/yolox_nano.onnx" \
            "https://huggingface.co/skillsafe-ai/yolox-nano/resolve/8e308810ede488f742901a4ac597dc7796798e46/yolox_nano.onnx"
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  $RUNNER_TEMP/yolox_nano.onnx" | sha256sum --check
      - name: Inference on THREE fixed published 12cm-context PNG previews, NO ground truth
        shell: bash
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          # Authors' ORIGINAL GitHub repository at pinned immutable commit.
          # README specifies an APPROXIMATE 12 cm camera height for corpus;
          # individual frames and their independent scenes NOT verified.
          # Repository MIT file is NOT independent license/subject-rights proof.
          # Fetch transient RGB previews, Git-blob SHA1-check before PNG decode.
          # JPEG recoding only in memory; no saved imagery, audio or identity.
          python -m microduck_companion.cata2b_public_low_probe \
            --approved-public-research-media \
            --model-path "$RUNNER_TEMP/yolox_nano.onnx" \
            > "$RUNNER_TEMP/cata2b_public_low_report.json"
          python - "$RUNNER_TEMP/cata2b_public_low_report.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as reader:
              report = json.load(reader)
          assert report["status"] == "unlabeled_host_public_low_angle_proposals_only"
          assert report["public_preview_frames"] == 3
          assert report["camera_height_author_reported_approx_mm"] == 120
          assert report["individual_frame_camera_height_independently_verified"] is False
          assert report["ground_truth_annotations_for_five_categories"] == 0
          assert report["localization_metrics_tp_fp_fn_ap50"] is None
          assert report["real_robust_low_camera_category_accuracy_known"] is False
          assert report["model_evaluated_on_public_preview_frames"] is True
          assert report["media_published_or_saved"] is False
          assert report["robot_or_rknn_validated"] is False
          assert report["motor_commands"] == report["sqlite_writes"] == report["qwen_calls"] == 0
          print(json.dumps(report, allow_nan=False, sort_keys=True))
          PY
      # No published image, no contact sheet, no artifacts of media/model,
      # no CI-visible raw paths, no motion/NPU/robot or SQLite writers.
      # Predictions have no per-image annotations and CANNOT be called TP/FP.
