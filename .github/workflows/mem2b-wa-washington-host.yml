name: MEM-2B-WA fixed Washington ball video host study (research only)
on:
  pull_request:
    paths:
      - "docs/mem2b-wa-washington-balls-prereg-2026-11-03.md"
      - "microduck_companion/rgbd_washington_mem2b_eval.py"
      - "tests/test_mem2b_wa_washington.py"
      - ".github/workflows/mem2b-wa-washington-host.yml"

permissions:
  contents: read

jobs:
  real-host-ball-memory-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch, no OEM/submodule changes
        uses: actions/checkout@v4
      - name: Python 3.11 on disposable Ubuntu runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test inherited MEM2B reference policy and source-free positive/negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_mem2b_wa_washington.py' -v
          python -B -m unittest discover -s tests -p 'test_mem2b_readonly_multiview.py' -v
          python -B -m unittest discover -s tests -p 'test_r2b2_abo_confusables.py' -v
      - name: Install only existing Pillow preprocessor (not a model)
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'
      - name: Download three SHA-pinned official HTTPS archives ephemerally and evaluate once
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          ROOT="$RUNNER_TEMP/mem2b-wa"
          mkdir -p "$ROOT"
          trap 'rm -rf -- "$ROOT"' EXIT
          BASE="https://rgbd-dataset.cs.washington.edu/dataset/rgbd-dataset"
          while IFS=: read -r n expected hash; do
            if [ -z "$n" ]; then continue; fi
            target="$ROOT/ball_${n}.tar"
            curl --fail --show-error --silent --location --retry 1               --proto '=https' --proto-redir '=https'               --connect-timeout 10 --max-time 120 --max-filesize "$expected"               --output "$target" "$BASE/ball_${n}.tar"
            test "$(stat -c %s "$target")" -eq "$expected"
            printf '%s  %s\n' "$hash" "$target" | sha256sum --check
          done <<'FIXED_SOURCES'
          1:5742008:31fa833e059bf248acd1f3cdd8e0da5769bfc300429638d9a363fc9bd7fd7352
          2:6558724:4d44cebe74da0255d785c9b24ea61967a6d21b94d605c5b11ddb3c0c342cb509
          3:5854518:41609ef7f541cd879676aa2bcfb1c6c545dfb1eee10d4bc0a8e1d5d841efe479
          FIXED_SOURCES
          python -B -m microduck_companion.rgbd_washington_mem2b_eval             --archive-dir "$ROOT"
          echo "MEDIA_ARTIFACTS_PUBLISHED: 0"
          echo "ROBOT_TESTED: false"
