name: PER-P4 300 unseen public COCO frames YOLO11n vs YOLO26n/seg

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/per_p4_coco300_yolo_compare.py"
      - "experiments/test_per_p4_coco300_yolo_compare.py"
      - "docs/per-p4-yolo26-coco300-prereg-2026-10-30.md"
      - ".github/workflows/per-p4-coco300-yolo26.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      YOLO_CONFIG_DIR: "/tmp/kwipi-yolo-config"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Verify pinned OEM & no private inputs
        run: |
          set -euo pipefail
          git ls-tree HEAD upstream/microduck | grep -F '942e58e3aa6dbb28e7037203fff11866122c7567'
          git ls-tree HEAD upstream/microduck_rl | grep -F 'b02fdea4902c2b93b7d34a83a6f05da4ececb7d3'
          test ! -e kwipi_photos_privees_tests_2026-10-30.zip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install host-only pinned public inference tools
        run: |
          python -m pip install --disable-pip-version-check \
            'ultralytics==8.4.60' \
            'pycocotools==2.0.10' \
            'Pillow==11.3.0' \
            'numpy==1.26.4'
      - name: Run fixed-cohort, negatives and semantic-ROI tests
        run: |
          python -m compileall -q experiments/per_p4_coco300_yolo_compare.py \
            experiments/test_per_p4_coco300_yolo_compare.py
          python -m unittest experiments.test_per_p4_coco300_yolo_compare -v
      - name: Retrieve verified COCO2017 validation metadata only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 \
            --output "$RUNNER_TEMP/instances_val2017.json" \
            "https://huggingface.co/datasets/LibreYOLO/coco2017/resolve/main/instances_val2017.json"
          echo "e8c7f7908f1d7278341fae127d0da654f102f11bd7b21d8aeefa635b8c810b6f  $RUNNER_TEMP/instances_val2017.json" | sha256sum --check
      - name: Execute 300 COCO public images across three frozen official YOLO variants
        shell: bash
        env:
          TORCH_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          python -m experiments.per_p4_coco300_yolo_compare \
            --annotations "$RUNNER_TEMP/instances_val2017.json" \
            --report "$RUNNER_TEMP/per-p4-coco300-numeric.json"
          python - "$RUNNER_TEMP/per-p4-coco300-numeric.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as f:
              result=json.load(f)
          assert result["new_images_evaluated_per_model"]==300
          assert result["excluded_historic_image_ids"]==132
          assert len(result["selected_image_ids"])==300
          assert len(set(result["selected_image_ids"]))==300
          assert result["low_view_robot_camera"] is False
          assert result["real_rknn_npu_validated"] is False
          assert result["robot_motion_issued"] is False
          assert result["sqlite_writes"]==0
          assert result["qwen_calls"]==0
          assert len(result["results"])==3
          assert result["ultralytics_version"]=="8.4.60"
          print(json.dumps({
              "evaluated_images": result["new_images_evaluated_per_model"],
              "results": {
                  k: {"priority_region_recall":v["priority_region_recall_iou50"],
                      "priority_class_recall":v["priority_class_recall_iou50"],
                      "mask_better_fraction":v["fraction_masks_better_than_rectangles"],
                      "host_p95_ms":v["host_inference_wall_p95_ms"]}
                  for k,v in result["results"].items()},
              "winner_for_further_study":result["recommended_for_further_low_view_study"],
              "physical_robot_validated":False
          }, sort_keys=True))
          PY
      - name: Save only numeric evidence; never JPEGs/models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwipi-per-p4-300-coco-numeric-only
          path: ${{ runner.temp }}/per-p4-coco300-numeric.json
          if-no-files-found: warn
          retention-days: 7
