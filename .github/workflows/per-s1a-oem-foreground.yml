name: PER-S1A RGB-only foreground shape/colour on pinned OEM views (host only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/per-s1a-oem-foreground.yml"
      - "experiments/per_s1a_oem_foreground.py"
      - "experiments/per_s0_lowview_oem_region.py"
      - "tests/test_per_s1a_oem_foreground.py"
      - "docs/per-s1a-oem-region-colour-silhouette-2026-10-30.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seven-preregistered-low-views:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MUJOCO_GL: osmesa
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify exact OEM pins and private assets absent
        run: |
          set -euo pipefail
          test "$(git -C upstream/microduck rev-parse HEAD)" = '942e58e3aa6dbb28e7037203fff11866122c7567'
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = 'b02fdea4902c2b93b7d34a83a6f05da4ececb7d3'
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene.xml
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene_vslam.xml
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene_apartment.xml
          test ! -e kwipi_photos_privees_tests_2026-10-30.zip

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "upstream/microduck_rl/uv.lock"

      - name: Install isolated existing MuJoCo / OpenCV / ONNX runtime (CPU only)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libgl1-mesa-dri
          uv python install 3.12
          uv venv --python 3.12 "$RUNNER_TEMP/per-s1a-venv"
          uv pip install --python "$RUNNER_TEMP/per-s1a-venv/bin/python" \
            'mujoco==3.10.0' 'numpy==1.26.4' \
            'onnxruntime==1.28.0' 'Pillow==11.3.0' \
            'PyOpenGL==3.1.10' 'opencv-python-headless==4.9.0.80'

      - name: Positive and negative pure tests before any ONNX download
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          "$RUNNER_TEMP/per-s1a-venv/bin/python" -m compileall -q \
            experiments/per_s0_lowview_oem_region.py \
            experiments/per_s1a_oem_foreground.py \
            tests/test_per_s1a_oem_foreground.py
          "$RUNNER_TEMP/per-s1a-venv/bin/python" -m unittest discover \
            -s tests -p test_per_s1a_oem_foreground.py -v
          "$RUNNER_TEMP/per-s1a-venv/bin/python" -m unittest discover \
            -s tests -p test_per_s0_lowview_oem_region.py -v

      - name: Validate seven frozen source-only OEM masks BEFORE obtaining weights
        id: geom
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          "$RUNNER_TEMP/per-s1a-venv/bin/python" -m experiments.per_s1a_oem_foreground \
            --scene-dir upstream/microduck_rl/src/mjlab_microduck/robot/microduck \
            --preflight-only \
            --report "$RUNNER_TEMP/per-s1a-geometry-only.json" \
            --authorize-static-oem-render
          valid=$("$RUNNER_TEMP/per-s1a-venv/bin/python" -c \
            'import json,sys; print("true" if json.load(open(sys.argv[1]))["preflight_gate_met"] else "false")' \
            "$RUNNER_TEMP/per-s1a-geometry-only.json")
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          if [ "$valid" != 'true' ]; then
            echo 'STOP: invalid OEM geometry; no weights downloaded'
          fi

      - name: Download pinned original YOLOX-Nano only if geometry valid
        if: steps.geom.outputs.valid == 'true'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 90 \
            'https://huggingface.co/skillsafe-ai/yolox-nano/resolve/8e308810ede488f742901a4ac597dc7796798e46/yolox_nano.onnx' \
            --output "$RUNNER_TEMP/per-s1a-yolox.onnx"
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  $RUNNER_TEMP/per-s1a-yolox.onnx" | sha256sum -c -

      - name: One frozen image-level pass and independent feature scores
        if: steps.geom.outputs.valid == 'true'
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          "$RUNNER_TEMP/per-s1a-venv/bin/python" -m experiments.per_s1a_oem_foreground \
            --scene-dir upstream/microduck_rl/src/mjlab_microduck/robot/microduck \
            --model "$RUNNER_TEMP/per-s1a-yolox.onnx" \
            --report "$RUNNER_TEMP/per-s1a-numeric-only.json" \
            --authorize-static-oem-render

      - name: Publish numeric reports ONLY, never RGB/mask/model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-s1a-numeric-only-geometric-and-feature-evidence
          path: |
            ${{ runner.temp }}/per-s1a-geometry-only.json
            ${{ runner.temp }}/per-s1a-numeric-only.json
          if-no-files-found: warn
          retention-days: 7
