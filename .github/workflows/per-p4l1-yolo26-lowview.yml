name: PER-P4L1 paired YOLO26 OEM low-view held-out head camera (host only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/per-p4l1-yolo26-lowview.yml"
      - "experiments/per_p4l1_yolo26_lowview.py"
      - "tests/test_per_p4l1_yolo26_lowview.py"
      - "docs/per-p4l1-yolo26-lowview-prereg-2026-11-03.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-lowview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MUJOCO_GL: osmesa
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      ULTRALYTICS_AUTOINSTALL: "false"
      YOLO_CONFIG_DIR: /tmp/kwipi-per-p4l1-ultralytics-config
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check frozen OEM/companion pin, no private source or image
        run: |
          set -euo pipefail
          test "$(git -C upstream/microduck rev-parse HEAD)" = '942e58e3aa6dbb28e7037203fff11866122c7567'
          test "$(git -C upstream/microduck_rl rev-parse HEAD)" = 'b02fdea4902c2b93b7d34a83a6f05da4ececb7d3'
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene_apartment.xml
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene_vslam.xml
          test -f upstream/microduck_rl/src/mjlab_microduck/robot/microduck/scene.xml
          test ! -e kwipi_photos_privees_tests_2026-10-30.zip

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "upstream/microduck_rl/uv.lock"

      - name: Install pinned host CPU and OEM renderer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libgl1-mesa-dri
          uv python install 3.12
          uv venv --python 3.12 "$RUNNER_TEMP/per-p4l1-venv"
          PY="$RUNNER_TEMP/per-p4l1-venv/bin/python"
          uv pip install --python "$PY" \
            'numpy==1.26.4' 'Pillow==11.3.0' 'mujoco==3.10.0' \
            'PyOpenGL==3.1.10'
          uv pip install --python "$PY" \
            'torch==2.5.1' 'torchvision==0.20.1' \
            --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python "$PY" 'ultralytics==8.4.192'
          "$PY" -m pip --version 2>/dev/null || true

      - name: Positive, adversarial and score decision tests (no model)
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          "$RUNNER_TEMP/per-p4l1-venv/bin/python" -m unittest discover \
            -s tests -p test_per_p4l1_yolo26_lowview.py -v
          "$RUNNER_TEMP/per-p4l1-venv/bin/python" -m compileall -q \
            experiments/per_p4l1_yolo26_lowview.py \
            tests/test_per_p4l1_yolo26_lowview.py

      - name: Geometry gate for all four frozen cases BEFORE model download
        id: preflight
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          "$RUNNER_TEMP/per-p4l1-venv/bin/python" \
            -m experiments.per_p4l1_yolo26_lowview \
            --scene-dir upstream/microduck_rl/src/mjlab_microduck/robot/microduck \
            --preflight-only \
            --output "$RUNNER_TEMP/per-p4l1-preflight.json" \
            --authorize-static-oem-render
          valid=$("$RUNNER_TEMP/per-p4l1-venv/bin/python" -c \
            'import json,sys; d=json.load(open(sys.argv[1])); print("true" if d["preflight_geometry_valid"] and d["inference_cases"] == 0 and len(d["geometry"]) == 4 else "false")' \
            "$RUNNER_TEMP/per-p4l1-preflight.json")
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          if [ "$valid" != "true" ]; then
            echo 'STOP geometry invalid; no models will be downloaded'
          fi

      - name: Download exact two existing Ultralytics official weights
        if: steps.preflight.outputs.valid == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/per-p4l1-models"
          curl --fail --location --retry 3 --max-time 180 \
            -o "$RUNNER_TEMP/per-p4l1-models/yolo26n.pt" \
            'https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.pt'
          echo "9b09cc8bf347f0fc8a5f7657480587f25db09b34bf33b0652110fb03a8ad4fef  $RUNNER_TEMP/per-p4l1-models/yolo26n.pt" | sha256sum -c -
          curl --fail --location --retry 3 --max-time 180 \
            -o "$RUNNER_TEMP/per-p4l1-models/yolo26n-seg.pt" \
            'https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n-seg.pt'
          echo "361fbfabab285c3237700b6bb91d7ecfa602cd945fffda8dbe1242829b71e73f  $RUNNER_TEMP/per-p4l1-models/yolo26n-seg.pt" | sha256sum -c -

      - name: One unchanged paired host inference on independent geom GT
        if: steps.preflight.outputs.valid == 'true'
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/upstream/microduck_rl/src"
          "$RUNNER_TEMP/per-p4l1-venv/bin/python" \
            -m experiments.per_p4l1_yolo26_lowview \
            --scene-dir upstream/microduck_rl/src/mjlab_microduck/robot/microduck \
            --weights-dir "$RUNNER_TEMP/per-p4l1-models" \
            --output "$RUNNER_TEMP/per-p4l1-results.json" \
            --authorize-static-oem-render
          "$RUNNER_TEMP/per-p4l1-venv/bin/python" - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "per-p4l1-results.json"
          report = json.loads(p.read_text())
          assert report["preflight_geometry_valid"]
          assert report["inference_cases"] == 8
          assert report["camera_or_motor_commands"] == 0
          assert report["memory_writes"] == report["qwen_calls"] == 0
          assert report["robot_or_npu_validated"] is False
          assert set(report["models"]) == {"yolo26n.pt", "yolo26n-seg.pt"}
          print("PER-P4L1 pair executed on OEM MuJoCo host only;")
          print("VALUE_GATE:", report["decision"]["status"])
          PY

      - name: Upload numeric geometry and quality only (no RGB, weights or masks)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-p4l1-lowview-numeric-only
          path: |
            ${{ runner.temp }}/per-p4l1-preflight.json
            ${{ runner.temp }}/per-p4l1-results.json
          if-no-files-found: warn
          retention-days: 7
